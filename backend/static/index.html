function renderMeta() {
  const m = state.meta;
  const i = (m.taxaMensal || 0) / 100;
  const n = m.prazoMeses || 1;
  const fv = m.valorAlvo || 0;
  const pv = m.valorAtual || 0;
  let pmt;
  if (i === 0) { pmt = (fv - pv) / n; } 
  else { const growthPV = pv * Math.pow(1 + i, n); pmt = (fv - growthPV) * i / (Math.pow(1 + i, n) - 1); }
  pmt = Math.max(pmt, 0);
  const semanal = pmt / 4.345;
  const diario = pmt / 30;

  return `
    <h1 class="page-title">Meta financeira</h1>
    <p class="page-sub">Baseado na lógica de juros compostos: quanto guardar por período para chegar no valor desejado.</p>

    <form id="form-meta">
      <div class="grid grid-2">
        <div class="field"><label>Valor que quero ter (R$)</label><input type="number" step="100" name="valorAlvo" value="${sfHtml(m.valorAlvo)}"></div>
        <div class="field"><label>Prazo (meses)</label><input type="number" name="prazoMeses" value="${sfHtml(m.prazoMeses)}"></div>
        <div class="field"><label>Rendimento mensal esperado (%)</label><input type="number" step="0.01" name="taxaMensal" value="${sfHtml(m.taxaMensal)}"></div>
        <div class="field"><label>Já tenho guardado hoje (R$)</label><input type="number" step="100" name="valorAtual" value="${sfHtml(m.valorAtual)}"></div>
      </div>
      <button type="submit" class="btn-primary">Calcular</button>
    </form>

    <div class="result-box" style="background:var(--bg-surface-2);border:1px solid var(--gold);border-radius:8px;padding:16px;margin-top:16px;">
      <div class="tiny">Para chegar a ${fmtBRL(fv)} em ${n} meses, rendendo ${sfHtml(m.taxaMensal)}% ao mês:</div>
      <div class="big" style="font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--gold);">${fmtBRL(pmt)} <span style="font-size:14px;color:var(--text-secondary);font-weight:500;">/ mês</span></div>
      <div class="grid grid-2" style="margin-top:14px;">
        <div><div class="tiny">Equivalente por semana</div><div class="mono" style="font-size:16px;color:var(--gold);">${fmtBRL(semanal)}</div></div>
        <div><div class="tiny">Equivalente por dia</div><div class="mono" style="font-size:16px;color:var(--gold);">${fmtBRL(diario)}</div></div>
      </div>
    </div>
    <div class="note">Cálculo de juros compostos com aportes mensais fixos (fórmula de anuidade).</div>
  `;
}

function renderFollowUp() {
  const today = todayStr();
  const dias = [3, 5, 7, 10, 15, 30, 60, 90];
  
  function ultimoContato(clienteId) {
    const orcs = state.orcamentos.filter(o => o.clienteId === clienteId);
    const vendas = state.vendas.filter(v => v.clienteId === clienteId);
    const todos = [...orcs.map(o => ({ data: o.data, tipo: 'orcamento' })), ...vendas.map(v => ({ data: v.data, tipo: 'venda' }))];
    if (todos.length === 0) return null;
    todos.sort((a, b) => b.data.localeCompare(a.data));
    return todos[0];
  }

  const clientesComContato = state.clientes.map(c => {
    const ultimo = ultimoContato(c.id);
    const stats = clienteStats(c.id);
    const ultimoContatoData = ultimo ? ultimo.data : null;
    const diasDesdeUltimoContato = ultimoContatoData ? daysBetween(ultimoContatoData, today) : null;
    return { ...c, ultimoContatoData, diasDesdeUltimoContato, ultimaCompra: stats.ultimaCompra };
  });

  let filtered = clientesComContato;
  if (state.followUpFilter !== 'todos') {
    const diasFilter = parseInt(state.followUpFilter);
    filtered = filtered.filter(c => c.diasDesdeUltimoContato !== null && c.diasDesdeUltimoContato >= diasFilter);
  }
  filtered.sort((a, b) => (b.diasDesdeUltimoContato || 0) - (a.diasDesdeUltimoContato || 0));

  const totalSemContato = clientesComContato.filter(c => c.diasDesdeUltimoContato !== null).length;
  const totalNunca = clientesComContato.filter(c => c.diasDesdeUltimoContato === null).length;

  return `
    <h1 class="page-title">Follow-up — Funil de tempo</h1>
    <p class="page-sub">Chaveiros que precisam de contato com base no tempo desde o último orçamento ou venda.</p>

    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="card stat-card"><div class="stat-label">Total com contato registrado</div><div class="stat-value" style="font-size:18px;">${totalSemContato}</div></div>
      <div class="card stat-card"><div class="stat-label">Nunca tiveram contato</div><div class="stat-value danger" style="font-size:18px;">${totalNunca}</div></div>
      <div class="card stat-card"><div class="stat-label">Precisam de atenção (30+ dias)</div><div class="stat-value" style="font-size:18px;">${clientesComContato.filter(c => c.diasDesdeUltimoContato !== null && c.diasDesdeUltimoContato >= 30).length}</div></div>
    </div>

    <div class="toolbar">
      <div class="filters">
        <div class="chip ${state.followUpFilter === 'todos' ? 'active' : ''}" data-follow-filter="todos">Todos</div>
        ${dias.map(d => `<div class="chip ${state.followUpFilter === String(d) ? 'active' : ''}" data-follow-filter="${d}">${d}+ dias</div>`).join('')}
      </div>
    </div>

    <div class="card" style="padding:0;overflow-x:auto;">
      ${filtered.length === 0 ? `<div class="empty">${ICONS.empty}<div>Nenhum chaveiro nessa condição.</div></div>` : `
      <table>
        <thead><tr><th>Chaveiro</th><th>Região</th><th>Último contato</th><th>Dias</th><th>Última compra</th><th></th></tr></thead>
        <tbody>
        ${filtered.map(c => {
          const statusPill = c.diasDesdeUltimoContato === null ? '<span class="pill pill-danger">Nunca</span>' : c.diasDesdeUltimoContato >= 30 ? '<span class="pill pill-danger">Crítico</span>' : c.diasDesdeUltimoContato >= 15 ? '<span class="pill pill-neutral">Atenção</span>' : '<span class="pill pill-success">Recentemente</span>';
          return `<tr>
            <td><a href="#" data-view-cliente="${sfHtml(c.id)}" style="color:var(--gold);text-decoration:none;font-weight:600;">${sfHtml(c.nome)}</a></td>
            <td><span class="pill pill-neutral">${getRegiao(c)}</span></td>
            <td>${c.ultimoContatoData ? fmtDate(c.ultimoContatoData) : '—'}</td>
            <td class="mono">${sfHtml(c.diasDesdeUltimoContato !== null ? c.diasDesdeUltimoContato + 'd' : '—')}</td>
            <td>${c.ultimaCompra ? fmtDate(c.ultimaCompra) : '—'}</td>
            <td style="display:flex;gap:4px;white-space:nowrap;">
              ${c.telefone ? `<button class="btn-outline btn-sm" data-wa-cliente="${sfHtml(c.id)}">${ICONS.whatsapp}</button>` : ''}
              <button class="btn-outline btn-sm" data-view-cliente="${sfHtml(c.id)}">Perfil</button>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>`}
    </div>
    <div class="note">O "último contato" considera tanto orçamentos quanto vendas registrados.</div>

async function loadAll() {
  state.clientes = await storGet(KEYS.clientes, []);
  state.vendas = await storGet(KEYS.vendas, []);
  state.orcamentos = await storGet(KEYS.orcamentos, []);
  state.marketing = await storGet(KEYS.marketing, []);
  state.contasPagar = await storGet(KEYS.contasPagar, []);
  state.activityLog = await storGet(KEYS.activityLog, []);
  state.templates = await storGet(KEYS.templates, [
    { id: 'tpl1', nome: '1º contato', texto: 'Oi {nome}, tudo bem? Aqui é da Chaves JSA 🔑 Somos fabricantes de chaves e acessórios, vendendo direto pra chaveiro. Posso te mandar nossa tabela de preços?' },
    { id: 'tpl2', nome: 'Follow-up', texto: 'Oi {nome}, tudo bem? Vi que fizemos um orçamento e queria saber se ficou alguma dúvida.' },
    { id: 'tpl3', nome: 'Reativação', texto: 'Oi {nome}, tudo bem? Faz {dias_sem_comprar} dias que você não faz pedido conosco. Fechamos condições novas!' }
  ]);
  state.codigosNaoEncontrados = await storGet(KEYS.codigosNaoEncontrados, []);
  
  // Produtos
  state.produtos = await storGet(KEYS.produtos, null);
  if (!state.produtos || state.produtos.length === 0) {
    state.produtos = PRODUTOS_PADRAO;
    await storSet(KEYS.produtos, state.produtos);
  }

  // Config
  const savedConfig = await storGet(KEYS.config, state.config);
  state.config = { ...state.config, ...savedConfig };
  if (!state.config.tiers) state.config.tiers = [];
  if (!state.config.taxaCartaoPorParcela) state.config.taxaCartaoPorParcela = { 1: 3.49, 2: 5.20, 3: 7, 4: null, 5: null, 6: null };
  
  state.meta = await storGet(KEYS.meta, state.meta);
  const savedSfConfig = await storGet(KEYS.sfConfig, state.sfConfig);
  state.sfConfig = { ...state.sfConfig, ...(savedSfConfig || {}) };
  if (!state.sfConfig.remetenteEndereco) state.sfConfig.remetenteEndereco = 'Avenida Antonio de Sousa Queiroz';
  if (!state.sfConfig.remetenteNumero) state.sfConfig.remetenteNumero = '656';
  if (!state.sfConfig || typeof state.sfConfig !== 'object') state.sfConfig = {};
  // The provider token belongs only in the server .env, never in browser storage.
  if (state.sfConfig.token) state.sfConfig = { ...state.sfConfig, token: '' };
  state.sfEmbalagens = await storGet(KEYS.sfEmbalagens, []);
  state.sfPesoProdutos = await storGet(KEYS.sfPesoProdutos, []);
  state.sfCache = await storGet(KEYS.sfCache, {});
  state.sfEtiquetas = await storGet(KEYS.sfEtiquetas, []);
  try {
    const sfStatus = await apiRequest('/api/superfrete/config');
    if (sfStatus.ok) state.sfServerConfig = await sfStatus.json();
  } catch (_) { state.sfServerConfig = { configured: false, environment: 'unknown', originPostalCode: '' }; }
  await refreshInfinitePay();
  try {
    const sfPendingResponse = await apiRequest('/api/superfrete/pending');
    if (sfPendingResponse.ok) {
      const pendingBody = await sfPendingResponse.json();
      for (const pending of (pendingBody.orders || [])) {
        let row = state.sfEtiquetas.find(item => item.superfreteOrderId === pending.order_id);
        if (!row) { row = { id: uid(), vendaId: pending.sale_id || '—', saleId: pending.sale_id || null, saleNumber: pending.sale_number || '', clienteId: pending.customer_id || null, superfreteOrderId: pending.order_id, transportadora: pending.carrier || pending.company || 'SuperFrete', servico: pending.service_id || pending.service || '', valor: pending.price ?? null, status: pending.status, trackingStatus: pending.status, trackingCode: '' }; state.sfEtiquetas.push(row); }
        else { row.status = pending.status || row.status; row.trackingStatus = row.status; if (pending.price != null) row.valor = pending.price; if (pending.service) row.transportadora = pending.service; if (pending.sale_id) { row.saleId = pending.sale_id; row.vendaId = pending.sale_id; } if (pending.sale_number) row.saleNumber = pending.sale_number; if (pending.customer_id) row.clienteId = pending.customer_id; }
      }
      if ((pendingBody.orders || []).length) await storSet(KEYS.sfEtiquetas, state.sfEtiquetas);
      for (const pending of (pendingBody.orders || [])) {
        if (!pending.sale_id || !state.vendas.some(sale => sale.id === pending.sale_id)) continue;
        const linkedSale = state.vendas.find(sale => sale.id === pending.sale_id);
        if (linkedSale?.freteLogistica?.orderId === pending.order_id) continue;
        await sfPersistFreightForSale(pending.sale_id, { id: pending.service_id || pending.service, price: pending.price, name: 'Serviço de entrega', company: pending.carrier || 'SuperFrete' }, { order_id: pending.order_id, price: pending.price, status: pending.status }, null);
      }
    }
  } catch (_) { /* A consulta é apenas reconciliação; o restante do painel continua disponível. */ }

  state.loading = false;
  render();
  showToast(backendDisponivel ? 'Conectado ao banco de dados (SQLite)' : 'Modo local — backend não encontrado, usando este navegador', backendDisponivel ? 'success' : 'info');
  
  // Verificar notificações
  const hoje = todayStr();
  const retornosAtrasados = state.clientes.filter(c => c.proximoRetorno && c.proximoRetorno.data < hoje);
  const contasVencidas = state.contasPagar.filter(c => c.status === 'pendente' && c.vencimento < hoje);
  if (retornosAtrasados.length > 0) showToast(`${retornosAtrasados.length} retorno(s) atrasado(s)`, 'warning');
  if (contasVencidas.length > 0) showToast(`${contasVencidas.length} conta(s) vencida(s)`, 'error');
}

async function registrarCodigoNaoEncontrado(codigo) {
  if (!codigo || codigo.trim() === '') return;
  const codigoLimpo = codigo.trim();
  let encontrado = state.codigosNaoEncontrados.find(c => c.codigo === codigoLimpo);
  if (encontrado) {
    encontrado.vezes += 1;
    encontrado.ultimaVez = todayStr();
  } else {
    state.codigosNaoEncontrados.push({ id: uid(), codigo: codigoLimpo, vezes: 1, primeiraVez: todayStr(), ultimaVez: todayStr() });
  }
  await storSet(KEYS.codigosNaoEncontrados, state.codigosNaoEncontrados);
}

function calcMargemPreview(produtoId, precoVenda) {
  const p = getProduto(produtoId);
  if (!p || !precoVenda || precoVenda <= 0) return null;
  const custo = p.custo || 0;
  if (custo <= 0) return null;
  return ((precoVenda - custo) / custo) * 100;
}
function renderVendaItemRows() {
  const temChaveSemAcessorio = state.vendaItems.some(it => ['yale', 'tetra'].includes(it.produtoId)) && !state.vendaItems.some(it => ['argola', 'chaveiro'].includes(it.produtoId));
  return state.vendaItems.map((it, idx) => {
    const defaultPrice = it.produtoId ? calcPrecoVendaPadrao(it.produtoId, parseInt(it.qtd) || 0) : 0;
    const precoAtual = it.precoVenda !== '' && it.precoVenda != null ? parseFloat(it.precoVenda) : defaultPrice;
    const margem = calcMargemPreview(it.produtoId, precoAtual);
    return `
      <div class="venda-item-row" data-idx="${idx}" style="display:flex;gap:8px;margin-bottom:4px;align-items:center;flex-wrap:wrap;">
        <select class="item-produto" style="flex:1.1;min-width:120px;">
          <option value="">Selecione...</option>
          ${getProdutosAtivos().map(p => `<option value="${sfHtml(p.id)}" ${it.produtoId === p.id ? 'selected' : ''}>${sfHtml(p.nome)}</option>`).join('')}
        </select>
        <input type="number" class="item-qtd" min="1" placeholder="Qtd" value="${sfHtml(it.qtd || '')}" style="flex:0.6;min-width:65px;">
        <input type="number" class="item-preco" step="0.01" placeholder="Padrão: ${fmtBRL(defaultPrice)}" value="${it.precoVenda || ''}" style="flex:0.9;min-width:110px;">
        <input type="text" class="item-modelo" placeholder="Modelo (ex: Z-420)" value="${sfHtml(it.modelo || '')}" style="flex:0.8;min-width:110px;">
        <span class="item-margem pill ${margem == null ? 'pill-neutral' : margem >= 40 ? 'pill-success' : margem >= 15 ? 'pill-neutral' : 'pill-danger'}" style="flex-shrink:0;min-width:56px;text-align:center;">${margem == null ? 'margem —' : margem.toFixed(0) + '%'}</span>
        ${state.vendaItems.length > 1 ? `<button type="button" class="btn-danger" data-remove-item="${idx}" style="flex-shrink:0;">✕</button>` : ''}
      </div>
    `;
  }).join('') + (temChaveSemAcessorio ? `<div class="tiny" style="color:var(--gold);margin:4px 0 8px;">💡 Dica: adicione argola ou chaveiro pra aumentar o ticket médio.</div>` : '');

    produtoId: row.querySelector('.item-produto')?.value || '',
    qtd: row.querySelector('.item-qtd')?.value || '',
    precoVenda: row.querySelector('.item-preco')?.value || '',
    modelo: row.querySelector('.item-modelo')?.value || ''
  }));
  const fd = new FormData(form);
  const common = {
    clienteId: fd.get('clienteId') || '', data: fd.get('data') || todayStr(), frete: fd.get('frete') || '',
    freteAssumido: fd.get('freteAssumido') || 'empresa', formaPagamento: fd.get('formaPagamento') || 'pix',
    parcelas: parseInt(fd.get('parcelas')) || 1, recipient: collectRecipientFields(form)
  };
  if (form.id === 'form-venda') state.vendaEditMeta = common;
  else state.orcEditMeta = { ...common, clienteNome: fd.get('clienteNome') || '', cep: common.recipient.postalCode || '', observacao: fd.get('observacao') || '' };
}

function bindPageEvents() {
  const manualPaymentForm = document.getElementById('form-infinitepay-manual');
  if (manualPaymentForm) manualPaymentForm.onsubmit = async event => {
    event.preventDefault();
    const button = manualPaymentForm.querySelector('button[type="submit"]');
    button.disabled = true;
    const formData = new FormData(manualPaymentForm);
    const amount = Number(formData.get('amount'));
    const amountCents = Math.round(amount * 100);
    if (!Number.isFinite(amount) || amountCents < 1) { showToast('Informe um valor maior que zero.', 'error'); button.disabled = false; return; }
    try {
      const result = await requestInfinitePayLink({
        source: 'manual', request_id: 'manual-' + uid(), payment_method: formData.get('payment_method'),
        amount_cents: amountCents, description: String(formData.get('description') || '').trim(),
        client_id: formData.get('client_id') || null
      });
      await refreshInfinitePay();
      render();
      showToast(result.reused ? 'Link existente carregado.' : 'Link de pagamento criado. Confira e copie-o no histórico.', 'success', 7000);
    } catch (error) {
      await refreshInfinitePay();
      render();
      showToast(error.message || 'Não foi possível criar o link. Verifique o histórico antes de repetir.', 'error', 9000);
    }
  };

  document.querySelectorAll('[data-gen-sale-payment]').forEach(button => {
    button.onclick = async () => {
      const saleId = button.dataset.genSalePayment;
      const methodSelect = [...document.querySelectorAll('[data-sale-payment-method]')].find(select => select.dataset.salePaymentMethod === saleId);
      const method = methodSelect?.value || 'pix';
      button.disabled = true;
      try {
        const result = await requestInfinitePayLink({ source: 'sale', sale_id: saleId, payment_method: method, request_id: 'sale-' + saleId + '-' + uid() });
        await refreshInfinitePay();
        render();
        showToast(result.reused ? 'Link existente recuperado; nenhuma nova cobrança foi criada.' : 'Link da venda criado. Confira-o na lista de pagamentos.', 'success', 7000);
      } catch (error) {
        await refreshInfinitePay();
        render();
        showToast(error.message || 'Falha ao gerar link. Confira o histórico antes de tentar novamente.', 'error', 9000);
      }
    };
  });

  document.querySelectorAll('[data-payment-check]').forEach(form => {
    form.onsubmit = async event => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      const formData = new FormData(form);
      try {
        const response = await apiRequest('/api/infinitepay/payment-check', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payment_id: form.dataset.paymentCheck, transaction_nsu: String(formData.get('transaction_nsu') || '').trim(), slug: String(formData.get('slug') || '').trim() }), timeoutMs: 25000
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(parseApiError(body, 'Não foi possível consultar o pagamento.'));
        await refreshInfinitePay();
        render();
        showToast(body.message || (body.payment?.status === 'paid' ? 'Pagamento confirmado pela InfinitePay.' : 'Consulta concluída: o pagamento ainda não consta como pago.'));
      } catch (error) {
        await refreshInfinitePay();
        render();
        showToast(error.message || 'Falha na consulta. Confira os dados do retorno.', 'error', 9000);
      }
    };
  });

  document.querySelectorAll('[data-resolve-payment]').forEach(button => {
    button.onclick = async () => {
      const orderNsu = button.dataset.orderNsu;
      if (!confirm(`Antes de liberar outra tentativa, confira no painel InfinitePay que o pedido ${orderNsu} NÃO existe. Deseja continuar?`)) return;
      const expected = `CONFIRMO NAO CRIADO ${orderNsu}`;
      const confirmation = prompt(`Digite exatamente para liberar uma nova tentativa:\n${expected}`);
      if (confirmation !== expected) { showToast('Confirmação incorreta. Nenhuma tentativa foi liberada.', 'info'); return; }
      button.disabled = true;
      try {
        const response = await apiRequest(`/api/infinitepay/payments/${encodeURIComponent(button.dataset.resolvePayment)}/resolve-uncertain`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirmation })
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(parseApiError(body, 'Não foi possível liberar a tentativa.'));
        await refreshInfinitePay();
        render();
        showToast('Tentativa marcada como não criada após sua confirmação. Você pode gerar um novo link.', 'warning', 8000);
      } catch (error) {
        await refreshInfinitePay();
        render();
        showToast(error.message || 'Falha ao liberar nova tentativa.', 'error', 9000);
      }
    };
  });

  // ===== PRODUTOS =====
  const btnNewProduto = document.getElementById('btn-new-produto');
  if (btnNewProduto) btnNewProduto.onclick = () => { state.modal = { type: 'produto' }; render(); };
  
  document.querySelectorAll('[data-edit-produto]').forEach(el => {
    el.onclick = () => { state.modal = { type: 'produto', editId: el.dataset.editProduto }; render(); };
  });
  
  document.querySelectorAll('[data-del-produto]').forEach(el => {
    el.onclick = async () => {
      if (!confirm('Excluir este produto?')) return;
      state.produtos = state.produtos.filter(p => p.id !== el.dataset.delProduto);
      await storSet(KEYS.produtos, state.produtos);
      showToast('Produto excluído com sucesso', 'success');
      render();
    };
  });

  // ===== FORM PRODUTO =====
  const formProduto = document.getElementById('form-produto');
  if (formProduto) {
    formProduto.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formProduto);
      const editId = state.modal.editId;
      const produto = {
        id: editId || uid(),
        nome: fd.get('nome'),
        codigo: fd.get('codigo') || '',
        custo: parseFloat(fd.get('custo')) || 0,
        venda: parseFloat(fd.get('venda')) || 0,
        descricao: fd.get('descricao') || '',
        estoque: fd.get('estoque') === '' ? null : (parseFloat(fd.get('estoque')) || 0),
        estoqueMinimo: fd.get('estoqueMinimo') === '' ? 0 : (parseFloat(fd.get('estoqueMinimo')) || 0),
        ativo: fd.get('ativo') === 'on'
      };
      const nextProducts = [...state.produtos];
      if (editId) {
        const idx = nextProducts.findIndex(p => p.id === editId);
        if (idx > -1) nextProducts[idx] = produto;
        else nextProducts.push(produto);
      } else {
        nextProducts.push(produto);
      }
      const nextConfig = { ...state.config };
      const isConfiguredKey = produto.id === 'yale' || produto.id === 'tetra';
      if (produto.id === 'yale') { nextConfig.yaleCusto = produto.custo; nextConfig.yaleVenda = produto.venda; }
      if (produto.id === 'tetra') { nextConfig.tetraCusto = produto.custo; nextConfig.tetraVenda = produto.venda; }
      try {
        if (isConfiguredKey) await storSetMany({ [KEYS.produtos]: nextProducts, [KEYS.config]: nextConfig }, { checkVersions: true });
        else await storSet(KEYS.produtos, nextProducts);
      } catch (_) { return; }
      state.produtos = nextProducts;
      if (isConfiguredKey) state.config = nextConfig;
      showToast(editId ? 'Produto atualizado com sucesso' : `Produto "${produto.nome}" adicionado com sucesso`, 'success');
      state.modal = null;
      render();
    };
  }

  // ===== FORM CONFIG =====
  const formConfig = document.getElementById('form-config');
  if (formConfig) {
    formConfig.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formConfig);
      const num = (k) => fd.get(k) === '' ? null : parseFloat(fd.get(k));
      const tiers = [];
      document.querySelectorAll('.tier-row').forEach(row => {
        const minQtd = parseInt(row.querySelector('.tier-minqtd').value) || 0;
        const precoYale = row.querySelector('.tier-yale').value === '' ? null : parseFloat(row.querySelector('.tier-yale').value);
        const precoTetra = row.querySelector('.tier-tetra').value === '' ? null : parseFloat(row.querySelector('.tier-tetra').value);
        if (minQtd > 0) tiers.push({ minQtd, precoYale, precoTetra });
      });
      const taxaCartaoPorParcela = {};
      document.querySelectorAll('.taxa-parcela-input').forEach(inp => {
        const n = parseInt(inp.dataset.parcela);
        taxaCartaoPorParcela[n] = inp.value === '' ? null : parseFloat(inp.value);
      });
      const nextConfig = {
        ...state.config,
        yaleCusto: num('yaleCusto') || 0,
        yaleVenda: num('yaleVenda') || 0,
        tetraCusto: num('tetraCusto') || 0,
        tetraVenda: num('tetraVenda') || 0,
        freteMedio: num('freteMedio') || 0,
        freteGratisAcima: num('freteGratisAcima') || 0,
        taxaCartaoPorParcela,
        metaVendasMensalValor: num('metaVendasMensalValor') || 0,
        metaVendasMensalQtd: num('metaVendasMensalQtd') || 0,
        tiers

      }) : [{ name: field('contentName'), quantity: Number(field('contentQuantity')), unitary_value: Number(field('contentValue')) }],
      insurance_value: Number(quote.insurance_value || 0), tag: 'JSA-' + uid()
    };
    if (sale) body.sale_id = sale.id;
    const submit = formSfShipment.querySelector('button[type="submit"]'); if (submit) submit.disabled = true;
    const result = await sfGerarEtiqueta(body);
    if (submit) submit.disabled = false;
    if (!result.ok) { showToast(result.erro || 'Não foi possível preparar o pedido.', 'error', 8000); return; }
    const order = result.dados.shipment;
    const row = { id: uid(), vendaId: sale?.id || '—', saleNumber: sale?.numero || '', saleId: sale?.id || null, clienteId: sale?.clienteId || quote.customerId || null, superfreteOrderId: order.order_id, transportadora: sfCarrierDisplay(selected), servico: service, valor: order.price ?? null, valorEstimado: selected.price ?? null, status: 'pending', trackingStatus: 'pending', trackingCode: '' };
    state.sfConfig = { ...state.sfConfig, remetenteNome: field('senderName'), remetenteDocumento: field('senderDocument'), remetenteTelefone: field('senderPhone'), remetenteEndereco: field('senderAddress'), remetenteNumero: field('senderNumber'), remetenteComplemento: field('senderComplement'), remetenteBairro: field('senderDistrict'), remetenteCidade: field('senderCity'), remetenteEstado: field('senderState').toUpperCase() };
    try {
      await storSet(KEYS.sfConfig, state.sfConfig);
      if (sale) {
        const linkResult = await sfPersistFreightForSale(sale.id, selected, order, row);
        if (linkResult.preserveCustomerCharge) {
          const reason = linkResult.activePayment
            ? `há um pagamento ${linkResult.activePayment.status} associado`
            : 'não foi possível confirmar o histórico de pagamentos InfinitePay';
          showToast(`Etiqueta ligada à venda ${sale.numero}. Como ${reason}, mantive o valor de frete cobrado intacto. Confira a cobrança e ajuste manualmente se necessário.`, 'warning', 10000);
        }
      } else {
        const nextLabels = [...state.sfEtiquetas, row];
        await storSet(KEYS.sfEtiquetas, nextLabels);
        state.sfEtiquetas = nextLabels;
      }
    } catch (error) {
      showToast(`A SuperFrete criou ${order.order_id}, mas o CRM não conseguiu concluir o vínculo local. NÃO repita a criação; atualize a tela e verifique a etiqueta. ${error.message || ''}`, 'error', 12000);
      return;
    }
    state.sfSelectedQuote = null; state.logisticaTab = 'etiquetas';
    if (!sale || (!sfActivePaymentForSale(sale.id) && state.infinitePayPaymentHistoryKnown === true)) showToast(`Pedido pendente ${order.order_id} criado${sale ? ` e vinculado à venda ${sale.numero}` : ''}. Nenhum valor foi debitado.`, 'success', 8000);

  document.querySelectorAll('[data-atualizar-rastreio]').forEach(button => {

      const result = await sfAtualizarRastreio(button.dataset.atualizarRastreio);
      if (!result.ok) showToast(result.erro || 'Falha ao atualizar a etiqueta.', 'error');
      else showToast(`Etiqueta ${result.etiqueta.status || result.etiqueta.trackingStatus} atualizada.`, 'success');
      render();

  document.querySelectorAll('[data-pagar-etiqueta]').forEach(button => {
    button.onclick = async () => {
      const row = state.sfEtiquetas.find(item => item.id === button.dataset.pagarEtiqueta);
      if (!row || !row.superfreteOrderId || row.valor == null) { showToast('Sem preço confirmado pela SuperFrete; não é possível pagar.', 'warning'); return; }
      const amount = Number(row.valor);
      if (!Number.isFinite(amount) || amount < 0) { showToast('Preço da etiqueta inválido; pagamento bloqueado.', 'error'); return; }
      if (!confirm(`Checkout SuperFrete em Produção\nEtiqueta: ${row.superfreteOrderId}\nValor a debitar do saldo: ${fmtBRL(amount)}\n\nO pagamento libera a etiqueta para postagem. Deseja continuar?`)) return;
      const phrase = prompt(`Para confirmar o débito de ${fmtBRL(amount)}, digite exatamente:\nPAGAR ${row.superfreteOrderId}`);
      if (phrase !== `PAGAR ${row.superfreteOrderId}`) { showToast('Pagamento cancelado; nenhum checkout foi enviado.', 'info'); return; }
      button.disabled = true;

        const response = await apiRequest('/api/superfrete/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order_id: row.superfreteOrderId, confirmation: phrase, expected_price: amount }) });

      const nextVendas = [...state.vendas, venda];

// BIND MODAL EVENTS
// ============================================================
function bindModalEvents() {
  const overlay = document.getElementById('overlay');
  if (overlay) {
    overlay.onclick = (e) => { if (e.target.id === 'overlay') { state.modal = null; state.importPreview = null; state.expandedPerfilVenda = null; render(); } };
  }
  const btnCancel = document.getElementById('btn-cancel');
  if (btnCancel) btnCancel.onclick = () => { state.modal = null; state.importPreview = null; state.expandedPerfilVenda = null; render(); };

  // ===== FORM CLIENTE =====
  const formCliente = document.getElementById('form-cliente');
  if (formCliente) {
    formCliente.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formCliente);
      const novo = { id: uid(), nome: fd.get('nome'), telefone: fd.get('telefone'), email: fd.get('email'), endereco: fd.get('endereco'), numero: fd.get('numero'), complemento: fd.get('complemento'), bairro: fd.get('bairro'), documento: fd.get('documento'), cidade: fd.get('cidade'), estado: (fd.get('estado') || '').toUpperCase(), cep: fd.get('cep'), canalOrigem: '', statusFunil: 'contato', tags: [], proximoRetorno: null };
      const candidate = [...state.clientes, novo];
      try { await storSet(KEYS.clientes, candidate); } catch (_) { return; }
      state.clientes = candidate;
      showToast(`Chaveiro ${novo.nome} cadastrado!`, 'success');
      state.modal = null;
      render();
    };
  }

  // ===== FORM EDIT CLIENTE =====
  const formEditCliente = document.getElementById('form-edit-cliente');
  if (formEditCliente) {
    formEditCliente.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formEditCliente);
      const idx = state.clientes.findIndex(c => c.id === state.modal.id);
      if (idx > -1) {
        const tags = (fd.get('tags') || '').split(',').map(t => t.trim()).filter(Boolean);
        const retornoData = fd.get('retornoData');
        const candidate = [...state.clientes];
        candidate[idx] = {
          ...state.clientes[idx],
          nome: fd.get('nome'),
          telefone: fd.get('telefone'),
          email: fd.get('email') || '',
          endereco: fd.get('endereco'),
          numero: fd.get('numero') || '',
          complemento: fd.get('complemento') || '',
          bairro: fd.get('bairro') || '',
          documento: fd.get('documento'),
          cidade: fd.get('cidade') || '',
          estado: (fd.get('estado') || '').toUpperCase(),
          cep: fd.get('cep') || '',
          canalOrigem: fd.get('canalOrigem') || '',
          statusFunil: fd.get('statusFunil') || 'contato',
          tags,
          proximoRetorno: retornoData ? { data: retornoData, nota: fd.get('retornoNota') || '' } : null
        };
        try { await storSet(KEYS.clientes, candidate); } catch (_) { return; }
        state.clientes = candidate;
        showToast('Chaveiro atualizado!', 'success');
      }
      state.modal = null;
      render();
    };
  }

  // ===== FORM VENDA =====
  const formVenda = document.getElementById('form-venda');
  if (formVenda) {
    formVenda.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formVenda);
      const itensRaw = [];
      document.querySelectorAll('.venda-item-row').forEach(row => {
        const produtoId = row.querySelector('.item-produto').value;
        const qtd = parseInt(row.querySelector('.item-qtd').value) || 0;
        const precoVendaRaw = row.querySelector('.item-preco').value;
        const modelo = row.querySelector('.item-modelo') ? row.querySelector('.item-modelo').value : '';
        if (qtd > 0 && produtoId) itensRaw.push({ produtoId, qtd, precoVenda: precoVendaRaw !== '' ? parseFloat(precoVendaRaw) : null, modelo });
      });
      if (itensRaw.length === 0) { showToast('Informe pelo menos um produto com quantidade.', 'error'); return; }
      const totals = calcItensTotals(itensRaw);
      const frete = parseFloat(fd.get('frete'));
      const editId = state.modal.editId;
      const formaPagamento = fd.get('formaPagamento') || 'pix';
      const parcelasForm = parseInt(fd.get('parcelas')) || 1;
      const taxaCartaoValor = calcTaxaCartao(totals.receita, formaPagamento, parcelasForm);
      const existingSale = editId ? state.vendas.find(v => v.id === editId) : null;
      const recipient = collectRecipientFields(formVenda);
      const selectedClient = state.clientes.find(c => c.id === fd.get('clienteId'));
      if (selectedClient && !recipient.name) recipient.name = selectedClient.nome || '';
      const venda = {
        id: editId || uid(),
        numero: existingSale?.numero || nextDocumentNumber('VEN', state.vendas),
        clienteId: fd.get('clienteId') || null,
        clienteNome: selectedClient?.nome || recipient.name || '',
        recipient,
        data: fd.get('data') || todayStr(),
        itens: totals.itens,
        receita: totals.receita,
        custoTotal: totals.custoTotal,
        frete: isNaN(frete) ? calcFrete(totals.totalQtd) : frete,
        freteAssumido: fd.get('freteAssumido') || calcFreteAssumido(totals.totalQtd),
        formaPagamento,
        parcelas: parcelasForm,
        taxaCartaoValor
      };
      const nextVendas = [...state.vendas];
      const saleIndex = nextVendas.findIndex(v => v.id === editId);
      if (saleIndex >= 0) nextVendas[saleIndex] = venda; else nextVendas.push(venda);
      let nextProdutos = state.produtos;
      if (existingSale) nextProdutos = ajustarEstoqueEm(nextProdutos, existingSale.itens, +1);
      nextProdutos = ajustarEstoqueEm(nextProdutos, venda.itens, -1);
      try {
        await storSetMany({ [KEYS.vendas]: nextVendas, [KEYS.produtos]: nextProdutos }, { checkVersions: true });
      } catch (_) { return; }
      state.vendas = nextVendas; state.produtos = nextProdutos;
      showToast(existingSale ? `Venda ${venda.numero} atualizada!` : `Venda ${venda.numero} de ${fmtBRL(venda.receita)} registrada!`, 'success');
      state.vendaEditMeta = null;
      state.modal = null;
      render();
    };
  }

  // ===== FORM ORÇAMENTO =====
  const formOrc = document.getElementById('form-orcamento');
  if (formOrc) {
    formOrc.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formOrc);
      const itensRaw = [];
      document.querySelectorAll('.venda-item-row').forEach(row => {
        const produtoId = row.querySelector('.item-produto').value;
        const qtd = parseInt(row.querySelector('.item-qtd').value) || 0;
        const precoVendaRaw = row.querySelector('.item-preco').value;
        const modelo = row.querySelector('.item-modelo') ? row.querySelector('.item-modelo').value : '';
        if (qtd > 0 && produtoId) itensRaw.push({ produtoId, qtd, precoVenda: precoVendaRaw !== '' ? parseFloat(precoVendaRaw) : null, modelo });
      });
      if (itensRaw.length === 0) { showToast('Informe pelo menos um produto.', 'error'); return; }
      const totals = calcItensTotals(itensRaw);
      const frete = parseFloat(fd.get('frete'));
      const freteFinal = isNaN(frete) ? calcFrete(totals.totalQtd) : frete;
      const freteAssumido = fd.get('freteAssumido') || calcFreteAssumido(totals.totalQtd);
      const editId = state.modal.editId;
      const existente = editId ? state.orcamentos.find(o => o.id === editId) : null;
      const cliente = state.clientes.find(c => c.id === fd.get('clienteId'));
      const recipient = collectRecipientFields(formOrc);
      if (cliente && !recipient.name) recipient.name = cliente.nome || '';
      if (cliente && !recipient.postalCode && cliente.cep) recipient.postalCode = cliente.cep;
      const orcamento = {
        id: editId || uid(),
        numero: existente?.numero || nextDocumentNumber('ORC', state.orcamentos),
        clienteId: fd.get('clienteId') || null,
        clienteNome: fd.get('clienteNome') || cliente?.nome || recipient.name || '',
        recipient,
        data: fd.get('data') || todayStr(),
        cep: recipient.postalCode || '',
        observacao: fd.get('observacao') || '',
        itens: totals.itens,
        frete: freteFinal,
        freteAssumido,
        formaPagamento: fd.get('formaPagamento') || 'pix',
        parcelas: parseInt(fd.get('parcelas')) || 1,
        valorTotal: totals.receita + (freteAssumido === 'cliente' ? freteFinal : 0),
        status: existente ? existente.status : 'aguardando',
        motivoPerda: existente ? existente.motivoPerda : ''
      };
      // Registrar códigos não encontrados
      const naoEncontrados = itensRaw.filter(it => {
        const resultado = convertLine(it.modelo || it.produtoId, 'auto');
        return resultado && resultado.status === 'nao_encontrado';
      });
      naoEncontrados.forEach(it => { registrarCodigoNaoEncontrado(it.modelo || it.produtoId); });

      const nextOrcamentos = [...state.orcamentos];
      const quoteIndex = nextOrcamentos.findIndex(o => o.id === editId);
      if (quoteIndex >= 0) nextOrcamentos[quoteIndex] = orcamento; else nextOrcamentos.push(orcamento);
      try { await storSet(KEYS.orcamentos, nextOrcamentos); } catch (_) { return; }
      state.orcamentos = nextOrcamentos;
      showToast(existente ? `Orçamento ${orcamento.numero} atualizado!` : `Orçamento ${orcamento.numero} de ${fmtBRL(orcamento.valorTotal)} criado!`, 'success');
      state.orcEditMeta = null;
      state.modal = null;
      render();
    };
  }

  // ===== FORM CONTA PAGAR =====
  const formContaPagar = document.getElementById('form-conta-pagar');
  if (formContaPagar) {
    formContaPagar.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formContaPagar);
      const editId = state.modal.editId;
      const existente = editId ? state.contasPagar.find(c => c.id === editId) : null;
      const conta = {
        id: editId || uid(),
        fornecedor: fd.get('fornecedor'),
        categoria: fd.get('categoria'),
        valor: parseFloat(fd.get('valor')) || 0,
        vencimento: fd.get('vencimento') || todayStr(),
        observacao: fd.get('observacao') || '',
        status: existente ? existente.status : 'pendente',
        dataPagamento: existente ? existente.dataPagamento : null
      };
      if (editId) {
        const idx = state.contasPagar.findIndex(c => c.id === editId);
        if (idx > -1) state.contasPagar[idx] = conta;
        else state.contasPagar.push(conta);
        showToast('Conta atualizada!', 'success');
      } else {
        state.contasPagar.push(conta);
        showToast(`Conta de ${conta.fornecedor} adicionada!`, 'success');
      }
      await storSet(KEYS.contasPagar, state.contasPagar);
      state.modal = null;
      render();
    };
  }

  // ===== FORM MARKETING =====
  const formMkt = document.getElementById('form-marketing-add');
  if (formMkt) {
    formMkt.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formMkt);
      const novo = { id: uid(), plataforma: fd.get('plataforma'), valor: parseFloat(fd.get('valor')) || 0, data: fd.get('data') || todayStr(), descricao: fd.get('descricao') };
      state.marketing.push(novo);
      await storSet(KEYS.marketing, state.marketing);
      showToast('Gasto de marketing lançado!', 'success');
      state.modal = null;
      render();
    };
  }

  // ===== FORM SUPERFRETE CONFIG =====
  const formSfConfig = document.getElementById('form-sf-config');
  if (formSfConfig) {
    // já tratado em bindPageEvents
  }

  // ===== FORM EMBALAGEM =====
  const formSfEmbalagem = document.getElementById('form-sf-embalagem');
  if (formSfEmbalagem) {
    formSfEmbalagem.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formSfEmbalagem);
      const editId = state.modal.editId;
      const embalagem = {
        id: editId || uid(),
        nome: fd.get('nome'),
        comprimento: parseFloat(fd.get('comprimento')) || 0,
        largura: parseFloat(fd.get('largura')) || 0,
        altura: parseFloat(fd.get('altura')) || 0,
        pesoEmbalagem: parseFloat(fd.get('pesoEmbalagem')) || 0,
        qtdMin: parseInt(fd.get('qtdMin')) || 1,
        qtdMax: parseInt(fd.get('qtdMax')) || 9999,
        ativa: fd.get('ativa') === 'on'
      };
      if (embalagem.qtdMin > embalagem.qtdMax) { showToast('A quantidade mínima não pode exceder a quantidade máxima.', 'warning'); return; }
      const index = state.sfEmbalagens.findIndex(x => x.id === editId);
      const candidate = [...state.sfEmbalagens];
      if (index >= 0) candidate[index] = embalagem; else candidate.push(embalagem);
      try { await storSet(KEYS.sfEmbalagens, candidate); state.sfEmbalagens = candidate; state.modal = null; showToast(index >= 0 ? 'Embalagem atualizada!' : 'Embalagem adicionada!', 'success'); render(); } catch (_) {}
    };
  }

  // ===== FORM PESO =====
  const formSfPeso = document.getElementById('form-sf-peso');
  if (formSfPeso) {
    formSfPeso.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formSfPeso);
      const editId = state.modal.editId;
      const peso = {
        id: editId || uid(),
        codigo: (fd.get('codigo') || '').trim().toUpperCase(),
        nome: fd.get('nome') || '',
        pesoUnitario: parseFloat(fd.get('pesoUnitario')) || 0,
        margemSeguranca: parseFloat(fd.get('margemSeguranca')) || 0
      };
      if (!(peso.pesoUnitario > 0)) { showToast('Informe um peso unitário maior que zero.', 'warning'); return; }
      const duplicate = state.sfPesoProdutos.some(item => item.id !== editId && String(item.codigo || '').trim().toUpperCase() === peso.codigo);
      if (duplicate) { showToast('Já existe um peso cadastrado com este código de modelo.', 'warning'); return; }
      const index = state.sfPesoProdutos.findIndex(x => x.id === editId);
      const candidate = [...state.sfPesoProdutos];
      if (index >= 0) candidate[index] = peso; else candidate.push(peso);
      try { await storSet(KEYS.sfPesoProdutos, candidate); state.sfPesoProdutos = candidate; state.modal = null; showToast(index >= 0 ? 'Peso atualizado!' : 'Peso adicionado!', 'success'); render(); } catch (_) {}
    };
  }

  // ===== IMPORT CSV =====
  const csvFile = document.getElementById('csv-file');
  if (csvFile) {
    csvFile.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const rows = parseGoogleContacts(ev.target.result);
        const newCount = rows.filter(r => !r.isDup).length;
        const dupCount = rows.length - newCount;
        state.importPreview = { rows, newCount, dupCount };
        render();
      };
      reader.readAsText(file, 'UTF-8');
    };
  }

  const btnConfirmImport = document.getElementById('btn-confirm-import');
  if (btnConfirmImport) {
    btnConfirmImport.onclick = async () => {
      const novos = state.importPreview.rows.filter(r => !r.isDup).map(r => ({ id: uid(), nome: r.nome, telefone: r.telefone, endereco: r.endereco || '', documento: '' }));
      state.clientes = state.clientes.concat(novos);
      await storSet(KEYS.clientes, state.clientes);
      showToast(`${novos.length} contatos importados com sucesso!`, 'success');
      state.importPreview = null;
      state.modal = null;
      render();
    };
  }

  // ===== VENDA ITEMS DINÂMICOS =====
  function atualizarMargemRow(row) {
    const produtoSel = row.querySelector('.item-produto');
    const precoInput = row.querySelector('.item-preco');
    const margemEl = row.querySelector('.item-margem');
    if (!produtoSel || !precoInput || !margemEl) return;
    const precoVenda = precoInput.value !== '' ? parseFloat(precoInput.value) : parseFloat((precoInput.placeholder || '').replace(/[^\d,.-]/g, '').replace(',', '.')) || 0;
    const margem = calcMargemPreview(produtoSel.value, precoVenda);
    margemEl.textContent = margem == null ? 'margem —' : margem.toFixed(0) + '%';
    margemEl.className = 'item-margem pill ' + (margem == null ? 'pill-neutral' : margem >= 40 ? 'pill-success' : margem >= 15 ? 'pill-neutral' : 'pill-danger');
  }
  document.querySelectorAll('.item-qtd').forEach(inp => {
    inp.addEventListener('input', () => {
      const row = inp.closest('.venda-item-row');
      const produtoSel = row.querySelector('.item-produto');
      const precoInput = row.querySelector('.item-preco');
      const qtd = parseInt(inp.value) || 0;
      if (produtoSel && precoInput && !precoInput.dataset.userEdited) {
        const defaultPrice = calcPrecoVendaPadrao(produtoSel.value, qtd);
        precoInput.placeholder = 'Padrão: ' + fmtBRL(defaultPrice);
      }
      atualizarMargemRow(row);
    });
  });

  document.querySelectorAll('.item-preco').forEach(inp => {
    inp.addEventListener('input', () => { inp.dataset.userEdited = '1'; atualizarMargemRow(inp.closest('.venda-item-row')); });
  });

  document.querySelectorAll('.item-produto').forEach(sel => {
    sel.addEventListener('change', () => {
      const row = sel.closest('.venda-item-row');
      const precoInput = row.querySelector('.item-preco');
      const qtdInput = row.querySelector('.item-qtd');
      if (precoInput && !precoInput.dataset.userEdited) {
        const defaultPrice = calcPrecoVendaPadrao(sel.value, parseInt(qtdInput.value) || 0);
        precoInput.placeholder = 'Padrão: ' + fmtBRL(defaultPrice);
      }
      atualizarMargemRow(row);
    });
  });

  // ===== SUPERFRETE ETIQUETA (simplificado) =====
  const btnSfConfirmarEtiqueta = document.getElementById('btn-sf-confirmar-etiqueta');
  if (btnSfConfirmarEtiqueta) {
    // Implementação simplificada - manter compatibilidade
  }
}

// ============================================================
// PARSE GOOGLE CONTACTS (mantido do original)
// ============================================================
function buildFullName(row, headers) {
  const exact = headers.find(h => h.trim().toLowerCase() === 'name');
  if (exact && row[exact] && row[exact].trim()) return row[exact].trim();
  const first = headers.find(h => h.trim().toLowerCase() === 'first name');
  const middle = headers.find(h => h.trim().toLowerCase() === 'middle name');
  const last = headers.find(h => h.trim().toLowerCase() === 'last name');
  const parts = [first, middle, last].filter(Boolean).map(h => (row[h] || '').trim()).filter(Boolean);
  if (parts.length) return parts.join(' ');
  const org = headers.find(h => h.trim().toLowerCase() === 'organization name');
  if (org && row[org] && row[org].trim()) return row[org].trim();
  return '';
}

function parseGoogleContacts(csvText) {
  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  const headers = parsed.meta.fields || [];
  const phoneCol = headers.find(h => /^phone\s*\d*\s*-\s*value$/i.test(h.trim())) || headers.find(h => /phone/i.test(h));
  const addrCol = headers.find(h => /address/i.test(h) && /formatted/i.test(h)) || headers.find(h => /address/i.test(h) && /street/i.test(h)) || headers.find(h => /address/i.test(h));
  const existingPhones = new Set(state.clientes.map(c => digitsOnly(c.telefone)).filter(Boolean));
  const rows = [];
  parsed.data.forEach(row => {
    const nome = buildFullName(row, headers);
    if (!nome) return;
    let telefoneRaw = phoneCol ? (row[phoneCol] || '').trim() : '';
    const telefone = telefoneRaw.split(':::')[0].trim();
    let endereco = addrCol ? (row[addrCol] || '').trim() : '';
    endereco = endereco.replace(/\s*\n\s*/g, ', ').replace(/^,\s*|,\s*$/g, '');
    if (!/[A-Za-zÀ-ÿ0-9]{2,}/.test(endereco)) endereco = '';
    const digits = digitsOnly(telefone);
    const isDup = digits ? existingPhones.has(digits) : false;
    if (digits) existingPhones.add(digits);
    rows.push({ nome, telefone, endereco, isDup });
  });
  return rows;
}
