<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0edf0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JSA CRM">
<title>JSA CRM — Sistema de Gestão</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg: #f0edf0;
  --bg-surface: #ffffff;
  --bg-surface-2: #f7f5f7;
  --border: #e4e0e6;
  --border-light: #f0edf2;
  --text: #1a181c;
  --text-secondary: #6b6670;
  --text-tertiary: #9a94a0;
  --accent: #7c7a8a;
  --accent-light: #a09cb0;
  --accent-gradient: linear-gradient(135deg, #8a86a0, #6b6678);
  --gold: #c9a227;
  --gold-light: #e8c84a;
  --gold-gradient: linear-gradient(135deg, #c9a227, #a88820);
  --success: #2f9e5c;
  --success-light: #e8f5ee;
  --danger: #c5453a;
  --danger-light: #fde8e6;
  --warning: #e8a838;
  --info: #4a7a9e;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.02);
  --shadow-hover: 0 8px 40px rgba(0,0,0,0.08);
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { 
  margin: 0; padding: 0; 
  background: var(--bg); 
  color: var(--text); 
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
  overflow-x: hidden; 
  min-height: 100vh; 
  min-height: 100dvh;
}
body { 
  background: var(--bg);
  background-image: 
    radial-gradient(ellipse at 10% 20%, rgba(120,115,140,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 80%, rgba(120,115,140,0.03) 0%, transparent 50%);
}

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--accent-light); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* TOAST */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 400px;
  width: 100%;
  pointer-events: none;
}
.toast {
  padding: 14px 20px;
  border-radius: var(--radius);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-hover);
  pointer-events: auto;
  animation: slideInToast 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  font-weight: 500;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.92);
}
.toast-success { border-left: 4px solid var(--success); }
.toast-error { border-left: 4px solid var(--danger); }
.toast-warning { border-left: 4px solid var(--warning); }
.toast-info { border-left: 4px solid var(--info); }
.toast-icon { font-size: 18px; flex-shrink: 0; }
.toast-close { 
  margin-left: auto; 
  background: none; 
  border: none; 
  cursor: pointer; 
  color: var(--text-tertiary);
  font-size: 16px;
  padding: 4px;
}
@keyframes slideInToast {
  0% { opacity: 0; transform: translateX(40px) scale(0.95); }
  100% { opacity: 1; transform: translateX(0) scale(1); }
}
.toast-exit { animation: slideOutToast 0.3s ease forwards; }
[hidden] { display: none !important; }
.auth-overlay { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; padding: 20px; background: rgba(23,20,28,.62); backdrop-filter: blur(5px); }
.auth-card { width: min(100%, 420px); background: #fff; padding: 28px; border-radius: 16px; box-shadow: 0 24px 80px rgba(0,0,0,.22); }
.auth-card h1 { font-size: 22px; margin-bottom: 8px; color: var(--text); }
.auth-card p { color: var(--text-secondary); line-height: 1.55; margin: 0 0 18px; }
.auth-card label { display:block; font-size:13px; font-weight:600; margin:0 0 7px; }
.auth-card input { width:100%; min-height:46px; border:1px solid var(--border); border-radius:8px; padding:10px 12px; font:inherit; }
.auth-card button { width:100%; min-height:46px; margin-top:12px; border:0; border-radius:8px; background:#7c7a8a; color:#fff; font:inherit; font-weight:700; cursor:pointer; }
.auth-message { min-height:20px; margin-top:10px; color:var(--danger); font-size:13px; }
.legacy-note { color:var(--text-secondary); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
@keyframes slideOutToast {
  0% { opacity: 1; transform: translateX(0); }
  100% { opacity: 0; transform: translateX(40px); }
}

/* APP */
.app { display: flex; min-height: 100vh; min-height: 100dvh; }

/* SIDEBAR */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.85);
}
.sidebar-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.sidebar-brand-logo { display: block; width: min(100%, 194px); height: auto; max-height: 54px; object-fit: contain; padding: 4px 7px; border-radius: 8px; background: #fff; }

.nav-group-label { padding: 12px 12px 4px; color: var(--text-tertiary); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.nav-item {
  width: 100%; text-align: left; background: transparent; font-family: inherit;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 2px;
  border-left: 3px solid transparent;
  transition: var(--transition);
}
.nav-item:hover { background: var(--bg-surface-2); color: var(--text); }
.nav-item:focus-visible, .auth-card button:focus-visible, .auth-card input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.nav-item.active {
  background: var(--bg-surface-2);
  color: var(--text);
  border-left-color: var(--gold);
  font-weight: 600;
}
.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.8; }
.nav-item .badge {
  margin-left: auto;
  background: var(--danger);
  color: white;
  font-size: 10px;
  padding: 1px 8px;
  border-radius: 20px;
  font-weight: 600;
}

/* MAIN */
.main { flex: 1; padding: 28px 34px; max-width: 1280px; min-width: 0; }
.page-title {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 26px;
  letter-spacing: -0.02em;
  margin: 0 0 4px 0;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.page-sub {
  color: var(--text-secondary);
  font-size: 13px;
  margin: 0 0 24px 0;
}

/* GRID */
.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: 1fr 1fr; }
@media(max-width: 1000px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
@media(max-width: 720px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }

/* CARDS */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.card:hover { box-shadow: var(--shadow-hover); border-color: var(--border-light); }

/* STAT CARDS */
.stat-card .stat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  font-weight: 600;
  margin-bottom: 6px;
}
.stat-card .stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
}
.stat-card .stat-value.gold { color: var(--gold); }
.stat-card .stat-value.success { color: var(--success); }
.stat-card .stat-value.danger { color: var(--danger); }

/* BUTTONS */
button {
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  border: none;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 13px;
  padding: 9px 18px;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
button:active { transform: scale(0.97); }
.btn-primary {
  background: var(--accent-gradient);
  color: white;
  box-shadow: 0 2px 12px rgba(107,102,120,0.25);
}
.btn-primary:hover { box-shadow: 0 4px 20px rgba(107,102,120,0.35); transform: translateY(-1px); }
.btn-gold {
  background: var(--gold-gradient);
  color: #1a181c;
  box-shadow: 0 2px 12px rgba(201,162,39,0.25);
}
.btn-gold:hover { box-shadow: 0 4px 20px rgba(201,162,39,0.35); transform: translateY(-1px); }
.btn-outline {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text-secondary);
}
.btn-outline:hover { background: var(--bg-surface-2); border-color: var(--accent-light); color: var(--text); }
.btn-danger {
  background: transparent;
  border: 1.5px solid var(--danger);
  color: var(--danger);
  padding: 6px 12px;
  font-size: 12px;
}
.btn-danger:hover { background: var(--danger-light); }
.btn-sm { padding: 6px 12px; font-size: 12px; }

/* INPUTS */
input, select, textarea {
  background: var(--bg-surface-2);
  border: 1.5px solid var(--border);
  color: var(--text);
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  width: 100%;
  transition: var(--transition);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent-light);
  box-shadow: 0 0 0 3px rgba(107,102,120,0.1);
}
label {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: block;
  margin-bottom: 5px;
  font-weight: 600;
}
.field { margin-bottom: 14px; }

/* CHIPS */
.chip {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  font-weight: 500;
}
.chip:hover { border-color: var(--accent-light); color: var(--text); }
.chip.active {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(201,162,39,0.08);
}
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

/* PILLS */
.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.pill-success { background: var(--success-light); color: var(--success); }
.pill-danger { background: var(--danger-light); color: var(--danger); }
.pill-neutral { background: var(--bg-surface-2); color: var(--text-secondary); }
.pill-gold { background: rgba(201,162,39,0.12); color: var(--gold); }

/* TABLE */
.table-wrap { overflow-x: auto; padding: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left;
  color: var(--text-tertiary);
  font-weight: 600;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(0,0,0,0.01); }
.mono { font-family: 'JetBrains Mono', monospace; }

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
.modal {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 28px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: var(--shadow-hover);
}
@keyframes slideUp { 0% { opacity: 0; transform: translateY(20px) scale(0.97); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
.modal h3 { font-weight: 700; font-size: 18px; margin: 0 0 18px 0; }
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  justify-content: flex-end;
  flex-wrap: wrap;
}
.modal-wide { max-width: 760px; }

/* SECTION TITLE */
.section-title {
  font-weight: 700;
  font-size: 15px;
  margin: 28px 0 12px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .key-mark {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  display: inline-block;
}

/* NOTE */
.note {
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-surface-2);
  border-left: 3px solid var(--accent-light);
  padding: 10px 14px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  margin-top: 10px;
  line-height: 1.5;
}

/* EMPTY */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-tertiary);
}
.empty svg { width: 40px; height: 40px; opacity: 0.3; margin-bottom: 10px; }

/* BAR ROW */
.bar-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.bar-label {
  width: 80px;
  font-size: 12px;
  color: var(--text-secondary);
  flex-shrink: 0;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bar-track {
  flex: 1;
  height: 18px;
  background: var(--bg-surface-2);
  border-radius: 4px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--gold-gradient);
  border-radius: 4px;
  transition: width 0.6s ease;
}
.bar-val {
  width: 90px;
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  flex-shrink: 0;
  font-weight: 500;
}

/* PRODUCT CHIP */
.product-chip-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.product-chip {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  flex: 1 1 160px;
  min-width: 150px;
  max-width: 220px;
  transition: var(--transition);
}
.product-chip:hover { border-color: var(--accent-light); box-shadow: var(--shadow); }
.product-chip-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.product-chip-code {
  font-weight: 700;
  color: var(--text);
  font-size: 14px;
}
.product-chip-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-secondary);
  padding: 2px 0;
}
.product-chip-row span:last-child { color: var(--text); }
.product-chip-row.total {
  border-top: 1px solid var(--border);
  margin-top: 5px;
  padding-top: 6px;
}
.product-chip-row.total span { color: var(--gold) !important; font-weight: 600; }

.expand-wrap {
  background: var(--bg-surface-2);
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  padding: 14px 16px;
}
.expand-label {
  font-size: 10.5px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 10px;
  font-weight: 600;
}

/* KPI CARDS */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.kpi-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  transition: var(--transition);
}
.kpi-card:hover { border-color: var(--accent-light); }
.kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); font-weight: 600; }
.kpi-value { font-size: 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }

/* RESPONSIVE */
@media(max-width: 720px) {
  .app { flex-direction: column; }
  .sidebar {
    width: 100%;
    height: auto;
    overflow-y: visible;
    flex-direction: row;
    align-items: center;
    padding: 8px 10px;
    gap: 2px;
    padding-top: calc(8px + env(safe-area-inset-top));
    border-right: none;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    position: sticky;
    top: 0;
    z-index: 40;
    box-shadow: var(--shadow);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
  }
  .sidebar::-webkit-scrollbar { display: none; }
  .sidebar-brand { display: flex; flex: 0 0 94px; width: 94px; min-width: 94px; justify-content: center; padding: 0 4px; margin: 0 4px 0 0; border-bottom: none; }
  .sidebar-brand-logo { width: 94px; max-height: 34px; padding: 4px; }
  .nav-item {
    flex-direction: column;
    gap: 3px;
    font-size: 9px;
    padding: 6px 10px;
    border-left: none;
    border-bottom: 2.5px solid transparent;
    white-space: nowrap;
    text-align: center;
    margin-bottom: 0;
    border-radius: 6px 6px 0 0;
  }
  .nav-item.active { border-left: none; border-bottom-color: var(--gold); }
  .nav-item svg { width: 18px; height: 18px; }
  .main { padding: 14px 12px; max-width: 100%; }
  .page-title { font-size: 20px; }
  .modal { padding: 18px 16px; max-width: 100%; border-radius: 16px 16px 0 0; max-height: 88vh; }
  .modal-overlay { padding: 0; align-items: flex-end; }
  table { font-size: 11px; }
  th, td { padding: 6px 8px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .toolbar { flex-direction: column; align-items: stretch; gap: 10px; }
  .venda-item-row { flex-direction: column; align-items: stretch !important; }
  .venda-item-row select, .venda-item-row input { flex: 1 1 100% !important; width: 100%; }
  .tier-row { flex-direction: column; align-items: stretch !important; }
  .tier-row input { flex: 1 1 100% !important; width: 100%; }
  .toast-container { top: 10px; right: 10px; left: 10px; max-width: none; }
}
</style>
</head>
<body>
<div class="app" id="app" hidden></div>
<div class="auth-overlay" id="auth-overlay" hidden>
  <form class="auth-card" id="auth-form" autocomplete="on">
    <h1>Acesso ao JSA CRM</h1>
    <p>Digite a chave local <code>APP_API_TOKEN</code> configurada pelo administrador no arquivo <code>.env</code>. O painel não salva alterações no navegador quando a API está indisponível.</p>
    <label for="api-password">Chave de acesso</label>
    <input id="api-password" name="password" type="password" autocomplete="current-password" required>
    <button id="auth-submit" type="submit">Entrar no painel</button>
    <div id="legacy-storage-note" class="auth-message legacy-note" role="status" aria-live="polite"></div>
    <button id="legacy-export-button" type="button" hidden>Baixar dados antigos deste navegador</button>
    <div id="auth-message" class="auth-message" role="alert" aria-live="polite"></div>
  </form>
</div>
<div class="toast-container" id="toast-container" aria-live="polite"></div>
<script>
// ============================================================
// TOAST SYSTEM
// ============================================================
function showToast(message, type = 'info', duration = 4000) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const icons = { success: '✓', error: '!', warning: '⚠', info: 'i' };
  const toast = document.createElement('div');

async function storSet(key, value) {

    if (storageVersions.has(key) && version) writeHeaders['If-Match'] = version;
    else if (storageVersions.has(key)) writeHeaders['If-None-Match'] = '*';
    const res = await apiRequest('/api/data/' + encodeURIComponent(key), {
      method: 'PUT', headers: writeHeaders, body: JSON.stringify({ value })
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 401) { sessionStorage.removeItem('jsaApiToken'); apiToken = ''; showAuth('A sessão expirou ou a chave mudou. Entre novamente.'); }
      const error = new Error(parseApiError(body, 'A API recusou a gravação (' + res.status + ').'));
      error.status = res.status;

    }
    backendDisponivel = true;
    storageVersions.set(key, body.updated_at || null);
    return true;
  } catch (e) {
    backendDisponivel = false;
    if (e.status === 409) showToast('Conflito: outra aba salvou uma versão mais recente. Nada foi sobrescrito. Recarregue o painel para continuar.', 'error', 9000);
    else showToast('Não foi salvo no banco. Esta alteração existe somente nesta página; não feche nem recarregue. Corrija a conexão e repita a ação.', 'error', 9000);

  const pattern = new RegExp('^' + escaped + '-(\\d+)$');
  const last = (records || []).reduce((max, record) => {

function downloadBlob(filename, content, mime) {

function getLegacyLocalValue(key) { try { return localStorage.getItem(key); } catch (_) { return null; } }
function exportLegacyBrowserData() {
  const mapping = {
    [KEYS.clientes]:'clientes', [KEYS.vendas]:'vendas', [KEYS.orcamentos]:'orcamentos',
    [KEYS.marketing]:'marketing', [KEYS.config]:'config', [KEYS.meta]:'meta',
    [KEYS.contasPagar]:'contasPagar', [KEYS.activityLog]:'activityLog', [KEYS.templates]:'templates',
    [KEYS.produtos]:'produtos', [KEYS.codigosNaoEncontrados]:'codigosNaoEncontrados',
    [KEYS.sfConfig]:'sfConfig', [KEYS.sfEmbalagens]:'sfEmbalagens', [KEYS.sfPesoProdutos]:'sfPesoProdutos',
    [KEYS.sfCache]:'sfCache', [KEYS.sfEtiquetas]:'sfEtiquetas'
  };
  const backup = { exportedAt:new Date().toISOString(), source:'legacy-localStorage-export', legacyStorageRaw:{}, secretsOmitted:[] };
  for (const [key, field] of Object.entries(mapping)) {
    const raw = getLegacyLocalValue(key);
    if (raw === null) continue;
    try {
      const parsed = JSON.parse(raw);
      if (field === 'sfConfig' && parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
        const hadToken = !!parsed.token;
        parsed.token = '';
        if (hadToken) backup.secretsOmitted.push('jsa-sf-config.token');
        backup[field] = parsed;
        backup.legacyStorageRaw[key] = JSON.stringify(parsed);
      } else {
        backup[field] = parsed;
        backup.legacyStorageRaw[key] = raw;
      }
    } catch (_) {
      // Never copy an unparseable SuperFrete config verbatim: it may contain a secret.
      if (field === 'sfConfig') { backup[field] = { token:'' }; backup.secretsOmitted.push('jsa-sf-config (valor não interpretável)'); }
      else { backup[field] = raw; backup.legacyStorageRaw[key] = raw; }
    }
  }
  downloadBlob('jsa-dados-legados-' + todayStr() + '.json', JSON.stringify(backup, null, 2), 'application/json');
  showToast('Cópia legada baixada. Tokens SuperFrete foram omitidos; revise os dados antes de importar. Nada foi enviado ou sincronizado.', 'warning', 9000);
}
function initLegacyStorageNotice() {
  const mapping = Object.values(KEYS);
  const found = mapping.filter(key => getLegacyLocalValue(key) !== null);
  const note = document.getElementById('legacy-storage-note');
  const button = document.getElementById('legacy-export-button');
  if (found.length) {
    note.textContent = `Encontramos ${found.length} conjunto(s) antigo(s) neste navegador. Eles não serão mesclados automaticamente com o banco.`;

  } else {
    note.textContent = 'Nenhum dado legado local foi encontrado neste navegador. Nenhuma cópia local será usada como banco.';
  }
}

function getProduto(id) {
  return state.produtos.find(p => p.id === id) || null;
}
function getProdutosAtivos() {
  return state.produtos.filter(p => p.ativo !== false);
}
function getProdutoOptions() {
  return getProdutosAtivos().map(p => `<option value="${sfHtml(p.id)}">${sfHtml(p.nome)}</option>`).join('');
}
function getProdutoCusto(produtoId) {
  const p = getProduto(produtoId);
  return p ? p.custo : 0;
}
function getProdutoVenda(produtoId) {
  const p = getProduto(produtoId);
  return p ? p.venda : 0;
}
function calcCustoUnit(produtoId) {
  return getProdutoCusto(produtoId);
}
function calcPrecoVendaPadrao(produtoId, qtd) {
  const p = getProduto(produtoId);
  if (!p) return 0;
  const base = p.venda || 0;
  const aplicaveis = (state.config.tiers || []).filter(t => {
    const preco = t.precoProduto?.[produtoId] ?? (produtoId === 'yale' ? t.precoYale : produtoId === 'tetra' ? t.precoTetra : null);
    return qtd >= t.minQtd && preco != null && preco !== '';
  });
  if (aplicaveis.length === 0) return base;
  aplicaveis.sort((a, b) => b.minQtd - a.minQtd);
  const melhor = aplicaveis[0];
  return melhor.precoProduto?.[produtoId] ?? (produtoId === 'yale' ? melhor.precoYale : produtoId === 'tetra' ? melhor.precoTetra : base);
}
function calcItensTotals(itens) {
  const totalQtd = itens.reduce((s, it) => s + (it.qtd || 0), 0);
  let receita = 0, custoTotal = 0;
  const detalhado = itens.map(it => {
    const custoUnit = calcCustoUnit(it.produtoId);
    const precoPadrao = calcPrecoVendaPadrao(it.produtoId, totalQtd);
    const precoVenda = (it.precoVenda !== null && it.precoVenda !== undefined && it.precoVenda !== '' && !isNaN(parseFloat(it.precoVenda))) 
      ? parseFloat(it.precoVenda) : precoPadrao;
    const produto = getProduto(it.produtoId);
    receita += precoVenda * it.qtd;
    custoTotal += custoUnit * it.qtd;
    return { 
      produtoId: it.produtoId, 
      produtoNome: produto ? produto.nome : 'Produto', 
      qtd: it.qtd, 
      custoUnit, 
      precoVenda, 
      modelo: (it.modelo || '').trim() 
    };
  });
  return { itens: detalhado, totalQtd, receita, custoTotal };
}
function temControleEstoque(produtoId) {
  const p = getProduto(produtoId);
  return !!(p && p.estoque !== null && p.estoque !== undefined && p.estoque !== '');
}
function ajustarEstoque(itens, sinal) {
  // sinal: -1 para dar baixa (venda), +1 para devolver (edição/exclusão)
  (itens || []).forEach(it => {
    const p = getProduto(it.produtoId);
    if (p && temControleEstoque(it.produtoId)) {
      p.estoque = Math.max(0, (parseFloat(p.estoque) || 0) + sinal * (it.qtd || 0));
    }
  });
}
function ajustarEstoqueEm(produtos, itens, sinal) {
  const candidate = (produtos || []).map(product => ({ ...product }));
  (itens || []).forEach(item => {
    const product = candidate.find(p => p.id === item.produtoId);
    if (product && product.estoque !== null && product.estoque !== undefined && product.estoque !== '') {
      product.estoque = Math.max(0, (parseFloat(product.estoque) || 0) + sinal * (item.qtd || 0));
    }
  });
  return candidate;
}
function getProdutosEstoqueBaixo() {
  return state.produtos.filter(p => p.ativo !== false && temControleEstoque(p.id) && (parseFloat(p.estoque) || 0) <= (parseFloat(p.estoqueMinimo) || 0));
}
function summarizeItens(itens) {
  const totals = {};
  (itens || []).forEach(it => {
    const p = getProduto(it.produtoId);
    const nome = p ? p.nome : it.produtoId;
    totals[nome] = (totals[nome] || 0) + (it.qtd || 0);
  });
  return Object.entries(totals).map(([nome, qtd]) => `${sfHtml(nome)} x${sfHtml(qtd)}`).join(' · ') || '—';

function dddDoTelefone(telefone) {
  let t = digitsOnly(telefone || '');
  if (!t) return null;
  if ((t.length === 12 || t.length === 13) && t.startsWith('55')) t = t.slice(2);
  if (t.length < 10) return null;
  return t.slice(0, 2);
}
function getRegiao(cliente) {
  const ddd = dddDoTelefone(cliente.telefone);
  if (ddd && DDD_INFO[ddd]) return `${DDD_INFO[ddd].cidade}/${DDD_INFO[ddd].uf}`;
  return 'Não identificado';
}
function computeRegioesBreakdown() {
  const regioes = {};
  state.clientes.forEach(c => {
    const reg = getRegiao(c);
    regioes[reg] = (regioes[reg] || 0) + 1;
  });
  return Object.entries(regioes).sort((a, b) => b[1] - a[1]);
}
function statusConsolidadoDDD(clientesDoDdd) {
  if (clientesDoDdd.length === 0) return 'sem_prospeccao';
  const stages = clientesDoDdd.map(c => c.statusFunil || 'contato');
  if (stages.includes('fechado')) return 'fechado';
  if (stages.includes('negociacao')) return 'negociacao';
  if (stages.includes('orcamento_enviado')) return 'orcamento_enviado';
  if (stages.includes('contato')) return 'contato';
  if (stages.includes('lead_frio')) return 'lead_frio';
  return 'perdido';
}
function computeMapaNacional() {
  const porDdd = {};
  Object.keys(DDD_INFO).forEach(ddd => { porDdd[ddd] = []; });
  state.clientes.forEach(c => {
    const ddd = dddDoTelefone(c.telefone);
    if (ddd && porDdd[ddd]) porDdd[ddd].push(c);
  });
  const porRegiao = {};
  Object.entries(DDD_INFO).forEach(([ddd, info]) => {
    porRegiao[info.regiao] = porRegiao[info.regiao] || [];
    porRegiao[info.regiao].push({ ddd, ...info, clientes: porDdd[ddd], status: statusConsolidadoDDD(porDdd[ddd]) });
  });
  const ordemRegioes = ['Sudeste','Sul','Nordeste','Centro-Oeste','Norte'];
  const semProspeccao = Object.values(porDdd).filter(l => l.length === 0).length;
  const leadsFrios = state.clientes.filter(c => (c.statusFunil || '') === 'lead_frio').length;
  return { porRegiao, ordemRegioes, totalDdds: Object.keys(DDD_INFO).length, semProspeccao, leadsFrios };
}
function getRegiaoPorCep(cep) {

function clienteStats(clienteId) {
  const compras = state.vendas.filter(v => v.clienteId === clienteId);
  const totalGasto = compras.reduce((s, v) => s + v.receita + ((v.freteAssumido || 'empresa') === 'cliente' ? v.frete : 0), 0);
  const qtdCompras = compras.length;
  const ultimaCompra = compras.length ? compras.map(v => v.data).sort().reverse()[0] : null;
  const diasSemComprar = ultimaCompra ? daysBetween(ultimaCompra, todayStr()) : null;
  return { totalGasto, qtdCompras, ultimaCompra, diasSemComprar };
}
function classifyABC(list) {
  const sorted = [...list].sort((a, b) => b.totalGasto - a.totalGasto);
  const total = sorted.reduce((s, c) => s + c.totalGasto, 0);
  let cum = 0;
  const result = {};
  sorted.forEach(c => {
    cum += c.totalGasto;
    const pct = total > 0 ? cum / total : 1;
    result[c.id] = pct <= 0.8 ? 'A' : pct <= 0.95 ? 'B' : 'C';
  });
  return result;
}
function previsaoRecompra(compras) {
  if (!compras || compras.length < 2) return null;
  const datas = compras.map(v => v.data).sort();
  let totalDias = 0;
  for (let i = 1; i < datas.length; i++) { totalDias += daysBetween(datas[i - 1], datas[i]); }
  const mediaDias = totalDias / (datas.length - 1);
  const ultima = datas[datas.length - 1];
  const diasDesde = daysBetween(ultima, todayStr());
  return { mediaDias: Math.round(mediaDias), diasDesde, provavel: diasDesde >= mediaDias * 0.8 };
}
function fillTemplate(texto, cliente) {
  const stats = clienteStats(cliente.id);
  return (texto || '')
    .replace(/\{nome\}/g, cliente.nome || '')
    .replace(/\{dias_sem_comprar\}/g, stats.diasSemComprar != null ? stats.diasSemComprar : '')
    .replace(/\{nota_retorno\}/g, (cliente.proximoRetorno && cliente.proximoRetorno.nota) || '');
}

  const digits = digitsOnly(telefone);

  const withCountry = digits.length <= 11 ? '55' + digits : digits;
  const url = 'https://wa.me/' + withCountry + '?text=' + encodeURIComponent(texto);
  window.open(url, '_blank');
}
function matchesSearch(c, q) {
  if (!q) return true;
  const ql = q.toLowerCase();
  const qDigits = digitsOnly(q);
  if (c.nome && c.nome.toLowerCase().includes(ql)) return true;
  if (c.telefone && (c.telefone.toLowerCase().includes(ql) || (qDigits && digitsOnly(c.telefone).includes(qDigits)))) return true;
  if (c.documento && (c.documento.toLowerCase().includes(ql) || (qDigits && digitsOnly(c.documento).includes(qDigits)))) return true;
  if (c.endereco && c.endereco.toLowerCase().includes(ql)) return true;
  return false;
}

function totalsRange(startStr, endStr) {
  const vs = state.vendas.filter(v => v.data >= startStr && v.data <= endStr);
  const receita = vs.reduce((s, v) => s + v.receita, 0);
  const custo = vs.reduce((s, v) => s + v.custoTotal, 0);
  const freteEmpresa = vs.reduce((s, v) => s + ((v.freteAssumido || 'empresa') === 'empresa' ? v.frete : 0), 0);
  const freteCliente = vs.reduce((s, v) => s + ((v.freteAssumido || 'empresa') === 'cliente' ? v.frete : 0), 0);
  const taxaCartaoTotal = vs.reduce((s, v) => s + (v.taxaCartaoValor || 0), 0);
  const receitaPix = vs.filter(v => (v.formaPagamento || 'pix') === 'pix').reduce((s, v) => s + v.receita, 0);
  const receitaCartao = vs.filter(v => v.formaPagamento === 'cartao').reduce((s, v) => s + v.receita, 0);
  const lucroBruto = receita - custo - freteEmpresa - taxaCartaoTotal;
  const marketingGasto = state.marketing.filter(m => m.data >= startStr && m.data <= endStr).reduce((s, m) => s + m.valor, 0);
  const contasPagas = state.contasPagar.filter(c => c.status === 'pago' && c.dataPagamento && c.dataPagamento >= startStr && c.dataPagamento <= endStr).reduce((s, c) => s + c.valor, 0);
  const lucroLiquido = lucroBruto - marketingGasto - contasPagas;
  return { receita, custo, freteEmpresa, freteCliente, taxaCartaoTotal, receitaPix, receitaCartao, lucroBruto, marketingGasto, contasPagas, lucroLiquido, vendas: vs.length };
}
function rangeMes() { const d = new Date(); const start = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; return totalsRange(start, todayStr()); }
function rangeAno() { const d = new Date(); const start = `${d.getFullYear()}-01-01`; return totalsRange(start, todayStr()); }
function rangeHoje() { const t = todayStr(); return totalsRange(t, t); }
function periodTotals(days) {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
  return totalsRange(cutoff.toISOString().slice(0, 10), todayStr());
}
function last7DaysSeries() {
  const arr = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const ds = d.toISOString().slice(0, 10);
    const receita = state.vendas.filter(v => v.data === ds).reduce((s, v) => s + v.receita, 0);
    arr.push({ label: d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', ''), receita, date: ds });
  }
  return arr;
}
function topModelos(vendasList, limit) {
  const map = {};
  vendasList.forEach(v => {
    (v.itens || []).forEach(it => {
      const key = (it.modelo || '').trim().toUpperCase();
      if (!key) return;
      map[key] = (map[key] || 0) + (it.qtd || 0);
    });
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, limit || 8).map(([modelo, qtd]) => ({ modelo, qtd }));
}

  matches.forEach(m => { uniqueByJsa[m.jsa] = uniqueByJsa[m.jsa] || m; });
  matches = Object.values(uniqueByJsa);
  if (matches.length) return matches;
  if (/^\d{2,6}$/.test(raw)) {
    const num = raw.replace(/^0+/, '');
    const found = ALL_DB.filter(e => jsaNumberPart(e.jsa) === num);
    if (found.length) return found.map(f => ({ ...f, matchType: 'jsa-numero' }));
  }
  return [];
}
function extractTokensFromLine(line) {
  let working = ' ' + line + ' ';
  const zPlaceholders = [];
  working = working.replace(/z[\s\-]?0*(\d{2,6})/gi, (m, num) => {
    zPlaceholders.push('Z-' + num);
    return ' \u0001' + (zPlaceholders.length - 1) + '\u0001 ';
  });
  working = working.replace(/\b(uni|unid\.?|unidades|un\.?|cod\.?|c[oó]digo|chave|pe[çc]as?|pc|pcs)\b/gi, ' ');
  let parts = working.split(/[^A-Za-z0-9\u0001]+/).filter(Boolean);
  parts = parts.map(p => {
    const m = p.match(/^\u0001(\d+)\u0001$/);
    return m ? zPlaceholders[parseInt(m[1])] : p;
  });
  return parts;
}
function convertLine(rawLine, brandHint) {
  const line = rawLine.trim();
  if (!line) return null;
  if (/gorj/i.test(line)) return { original: rawLine, status: 'gorja', codigo: rawLine };
  const fabHint = detectFabricante(line);
  const linhaHint = /tetra/i.test(line) ? 'tetra' : null;
  const tokens = extractTokensFromLine(line);
  if (tokens.length === 0) return { original: rawLine, status: 'vazio', codigo: rawLine };
  const candidatesPerToken = [];
  for (const t of tokens) {
    const m = matchCode(t, brandHint);
    if (m.length) candidatesPerToken.push({ token: t, matches: m });
  }
  if (candidatesPerToken.length === 0) return { original: rawLine, status: 'nao_encontrado', codigo: rawLine };
  candidatesPerToken.sort((a, b) => b.token.replace(/\D/g, '').length - a.token.replace(/\D/g, '').length);
  const chosen = candidatesPerToken[0];
  const codeToken = chosen.token;
  let filtered = chosen.matches;
  if (fabHint) { const f2 = filtered.filter(x => x.fab === fabHint); if (f2.length) filtered = f2; }
  if (linhaHint) { const f3 = filtered.filter(x => x.linha === linhaHint); if (f3.length) filtered = f3; }
  const bestMatches = filtered;
  let qty = null;
  for (const t of tokens) {
    if (t === codeToken) continue;
    if (/^\d+$/.test(t)) { qty = parseInt(t); break; }
  }
  if (bestMatches.length === 0) return { original: rawLine, status: 'nao_encontrado', codigo: rawLine };
  if (bestMatches.length > 1) return { original: rawLine, status: 'ambiguo', opcoes: bestMatches, qty, codigo: rawLine };
  return { original: rawLine, status: 'ok', item: bestMatches[0], qty, codigoDigitado: codeToken };
}
function convertText(fullText, brandHint) {
  return fullText.split(/\n/).map(l => l.trim()).filter(Boolean).map(l => convertLine(l, brandHint)).filter(Boolean);
}

function sfInterpretarErro(status, corpo) {
  const msg = (corpo && (corpo.message || corpo.error || '')).toString().toLowerCase();
  if (status === 401 || msg.includes('token') || msg.includes('unauthor')) return SF_MENSAGENS_ERRO.token_invalido;
  if (msg.includes('cep') || msg.includes('postal')) return SF_MENSAGENS_ERRO.cep_invalido;
  if (msg.includes('saldo') || msg.includes('balance') || msg.includes('insufficient')) return SF_MENSAGENS_ERRO.saldo_insuficiente;
  if (msg.includes('weight') || msg.includes('peso')) return SF_MENSAGENS_ERRO.peso_invalido;
  if (status === 0 || status >= 500) return SF_MENSAGENS_ERRO.indisponivel;
  return SF_MENSAGENS_ERRO.desconhecido;

async function sfRequest(path, method, body) {

  const routes = {
    '/user': '/api/superfrete/account',
    '/calculator': '/api/superfrete/quote'
  };
  const route = routes[path];
  if (!route) return { ok: false, erro: 'Operação disponível somente pelo fluxo Logística do JSA CRM.' };
  try {
    const resp = await apiRequest(route, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const corpo = await resp.json().catch(() => ({}));
    if (!resp.ok) return { ok: false, erro: parseApiError(corpo, sfInterpretarErro(resp.status, corpo)), statusCode: resp.status };
    return { ok: true, dados: corpo };

    return { ok: false, erro: SF_MENSAGENS_ERRO.indisponivel };
  }
}
function sfPesoProduto(modelo) {

  return registro ? { peso: registro.pesoUnitario || 0, margem: registro.margemSeguranca || 0 } : null;

function sfCalcularPesoTotal(itens) {

function sfCalcularPesoBase(itens) {

function sfEscolherEmbalagem(qtdTotal) {

function sfQuoteDefaultsForSale(sale) {

    return { modelo: item.modelo || product?.codigo || '', qtd: Math.max(0, parseInt(item.qtd, 10) || 0) };

}
function sfBuscarCache(chave) {

async function sfCotarFrete({ cepDestino, itens, valorDeclarado }) {
  if (!sfTokenValido()) return { ok: false, erro: SF_MENSAGENS_ERRO.sem_token };
  if (!cepDestino || cepDestino.replace(/\D/g, '').length < 8) return { ok: false, erro: SF_MENSAGENS_ERRO.cep_invalido };
  const qtdTotal = itens.reduce((s, i) => s + (i.qtd || 0), 0);
  const embalagem = sfEscolherEmbalagem(qtdTotal);
  if (!embalagem) return { ok: false, erro: 'Nenhuma embalagem cadastrada em Logística para essa quantidade.' };
  const peso = sfCalcularPesoTotal(itens) + (embalagem.pesoEmbalagem || 0);
  if (peso <= 0) return { ok: false, erro: SF_MENSAGENS_ERRO.peso_invalido };
  const dims = { comprimento: embalagem.comprimento, largura: embalagem.largura, altura: embalagem.altura };
  const chaveCache = sfChaveCache(cepDestino, peso, dims);
  const cacheado = sfBuscarCache(chaveCache);
  if (cacheado) return { ok: true, dados: cacheado, deCache: true };
  const payload = {
    to_postal_code: cepDestino.replace(/\D/g, ''),
    width: dims.largura, height: dims.altura, length: dims.comprimento,
    weight: Number(peso.toFixed(3)), insurance_value: valorDeclarado || 0,
    services: state.sfConfig.servicesFiltro || '1,2,17'
  };
  const resp = await sfRequest('/calculator', 'POST', payload);
  if (!resp.ok) return resp;
  await sfSalvarCache(chaveCache, resp.dados.quotes);
  return { ok: true, dados: resp.dados.quotes, deCache: false };
}
function sfAplicarRegraFreteGratis(cotacoes, qtdTotal) {
  const temDireito = qtdTotal >= (state.config.freteGratisAcima || Infinity);
  if (!temDireito || !Array.isArray(cotacoes) || cotacoes.length === 0) return cotacoes;
  const ordenadas = [...cotacoes].sort((a, b) => parseFloat(a.price || a.custom_price || 0) - parseFloat(b.price || b.custom_price || 0));
  const precoEconomico = parseFloat(ordenadas[0].price || ordenadas[0].custom_price || 0);
  return cotacoes.map(c => {
    const preco = parseFloat(c.price || c.custom_price || 0);
    const ehEconomica = c === ordenadas[0];
    return { ...c, _gratis: ehEconomica, _valorAdicional: ehEconomica ? 0 : Math.max(0, preco - precoEconomico) };
  });
}

function calcLucroVenda(sale) {
  const base = (Number(sale?.receita) || 0) - (Number(sale?.custoTotal) || 0) - (Number(sale?.taxaCartaoValor) || 0);
  const customerPaid = (sale?.freteAssumido || 'empresa') === 'cliente';
  const actualCost = Number(sale?.freteLogistica?.actualAmount);
  if (Number.isFinite(actualCost) && actualCost >= 0) {
    return base + (customerPaid ? (Number(sale?.frete) || 0) - actualCost : -actualCost);
  }
  return base - (customerPaid ? 0 : (Number(sale?.frete) || 0));
}
async function sfSyncLabelToSale(label, info) {
  if (!label?.saleId) return;
  const index = state.vendas.findIndex(sale => sale.id === label.saleId);
  if (index < 0) return;
  const previousSale = state.vendas[index];
  const actual = Number(info?.price ?? label.valor);
  const hasActual = Number.isFinite(actual) && actual >= 0;
  const activePayment = sfActivePaymentForSale(previousSale.id);
  const paymentHistoryUnknown = state.infinitePayPaymentHistoryKnown !== true;
  const shipping = {
    ...(previousSale.freteLogistica || {}),
    provider: 'SuperFrete', status: info?.status || label.trackingStatus || label.status || 'pending',
    carrier: label.transportadora || previousSale.freteLogistica?.carrier || 'SuperFrete',
    orderId: label.superfreteOrderId || previousSale.freteLogistica?.orderId || null,
    actualAmount: hasActual ? actual : (previousSale.freteLogistica?.actualAmount ?? null),
    trackingCode: info?.tracking || label.trackingCode || '',

  };
  const updatedSale = { ...previousSale, freteLogistica: shipping };
  if (hasActual && !(previousSale.freteAssumido === 'cliente' && (activePayment || paymentHistoryUnknown))) updatedSale.frete = actual;
  const nextSales = [...state.vendas]; nextSales[index] = updatedSale;
  await storSetMany({ [KEYS.vendas]: nextSales, [KEYS.sfEtiquetas]: state.sfEtiquetas }, { checkVersions: true });

async function sfPersistFreightForSale(saleId, quote, order = null, labelRow = null) {
  const saleIndex = state.vendas.findIndex(item => item.id === saleId);
  if (saleIndex < 0) throw new Error('Venda não encontrada. Atualize a tela antes de vincular o frete.');
  const sale = state.vendas[saleIndex];
  const quotedAmount = Number(quote?.price ?? quote?.custom_price);
  const providerAmount = Number(order?.price);
  const amount = Number.isFinite(providerAmount) && providerAmount >= 0 ? providerAmount : quotedAmount;
  if (!Number.isFinite(amount) || amount < 0) throw new Error('A cotação não contém um valor de frete válido.');
  const activePayment = sfActivePaymentForSale(saleId);
  const paymentHistoryUnknown = state.infinitePayPaymentHistoryKnown !== true;
  const preserveCustomerCharge = sale.freteAssumido === 'cliente' && (!!activePayment || paymentHistoryUnknown);
  const serviceId = quote?.service_id ?? quote?.service?.id ?? quote?.id ?? null;
  const logistics = {
    ...(sale.freteLogistica || {}),
    provider: 'SuperFrete',
    status: order ? (order.status || 'pending') : 'quoted',
    carrier: sfCarrierDisplay(quote),
    service: String(quote?.name || quote?.service_name || quote?.service || 'Serviço de entrega'),
    serviceId: serviceId == null ? null : String(serviceId),
    quoteAmount: Number.isFinite(quotedAmount) ? quotedAmount : null,
    actualAmount: Number.isFinite(providerAmount) && providerAmount >= 0 ? providerAmount : null,
    orderId: order?.order_id || sale.freteLogistica?.orderId || null,
    deliveryTime: quote?.delivery_time ?? quote?.delivery_range?.max ?? quote?.delivery_range ?? null,
    destinationPostalCode: state.sfQuoteRequest?.to_postal_code || sfSaleRecipient(sale).postalCode || '',
    package: state.sfQuoteRequest ? {

      weight: Number(state.sfQuoteRequest.effective_weight ?? state.sfQuoteRequest.weight) || null
    } : null,
    linkedAt: new Date().toISOString(),
    paymentStatusAtLink: activePayment?.status || (paymentHistoryUnknown ? 'unavailable' : null)
  };
  const updatedSale = { ...sale, freteLogistica: logistics };
  if (!preserveCustomerCharge) updatedSale.frete = amount;
  const nextSales = [...state.vendas];
  nextSales[saleIndex] = updatedSale;
  const values = { [KEYS.vendas]: nextSales };
  let nextLabels = state.sfEtiquetas;
  if (labelRow) {
    nextLabels = [...state.sfEtiquetas, labelRow];
    values[KEYS.sfEtiquetas] = nextLabels;
  }
  await storSetMany(values, { checkVersions: true });
  state.vendas = nextSales;
  if (labelRow) state.sfEtiquetas = nextLabels;
  return { preserveCustomerCharge, paymentHistoryUnknown, activePayment, amount };
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `

    </div>
    <div class="main" id="main"></div>
    ${state.modal ? renderModal() : ''}
  `;
  
  document.querySelectorAll('[data-nav]').forEach(el => {

  });
  
  const main = document.getElementById('main');
  if (state.loading) { main.innerHTML = `<div class="empty">Carregando dados...</div>`; return; }
  
  // Renderizar a aba correta
  switch(state.tab) {
    case 'dashboard': main.innerHTML = renderDashboard(); break;

    case 'agenda': main.innerHTML = renderAgenda(); break;

    case 'pagamentos': main.innerHTML = renderPagamentos(); break;

    case 'marketing': main.innerHTML = renderMarketing(); break;
    case 'config': main.innerHTML = renderConfig(); break;
    case 'produtos': main.innerHTML = renderProdutos(); break;
    case 'meta': main.innerHTML = renderMeta(); break;
    case 'atividades': main.innerHTML = renderAtividades(); break;
    case 'followup': main.innerHTML = renderFollowUp(); break;
    case 'codigosnaoencontrados': main.innerHTML = renderCodigosNaoEncontrados(); break;
    default: main.innerHTML = renderDashboard();
  }
  bindPageEvents();
  if (state.modal) bindModalEvents();
}

function renderPreservingInputFocus(input) {
  const id = input?.id;
  const start = input?.selectionStart;
  const end = input?.selectionEnd;
  render();
  const replacement = id ? document.getElementById(id) : null;
  if (replacement) {
    replacement.focus();
    if (typeof start === 'number' && typeof end === 'number') {
      try { replacement.setSelectionRange(start, end); } catch (_) {}
    }
  }
}

function renderClientes() {
  let list = state.clientes.map(c => ({ ...c, stats: clienteStats(c.id) }));
  const abcMap = classifyABC(list.map(c => ({ id: c.id, totalGasto: c.stats.totalGasto })));
  if (state.clientFilter === '30') list = list.filter(c => c.stats.diasSemComprar !== null && c.stats.diasSemComprar >= 30);
  if (state.clientFilter === '60') list = list.filter(c => c.stats.diasSemComprar !== null && c.stats.diasSemComprar >= 60);
  if (state.clientFilter === '90') list = list.filter(c => c.stats.diasSemComprar !== null && c.stats.diasSemComprar >= 90);
  if (state.clientFilter === 'nunca') list = list.filter(c => c.stats.diasSemComprar === null);
  if (state.clientFilter === 'prospeccao') list = list.filter(c => c.canalOrigem === 'Prospecção fria' && c.stats.qtdCompras === 0);
  list = list.filter(c => matchesSearch(c, state.clientSearch));
  list.sort((a, b) => (b.stats.diasSemComprar ?? -1) - (a.stats.diasSemComprar ?? -1));

  const regioesList = computeRegioesBreakdown();
  const topRegioes = regioesList.slice(0, 3);
  const restoCount = regioesList.length - topRegioes.length;

  return `
    <h1 class="page-title">Chaveiros</h1>
    <p class="page-sub">Cadastro, histórico de compras e quem está sem comprar há mais tempo.</p>

    <div class="region-bar" style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;">

function renderVendas() {
  const rows = [...state.vendas].sort((a, b) => b.data.localeCompare(a.data));

      <div></div>

      ${rows.length === 0 ? `<div class="empty">${ICONS.empty}<div>Nenhuma venda registrada.</div></div>` : `
      <table>
        <thead><tr>
          <th></th><th>Nº da venda</th><th>Data</th><th>Cliente</th><th>Produtos</th><th>Receita</th><th>Custo</th><th>Frete</th><th>Lucro</th><th></th>
        </tr></thead>
        <tbody>
        ${rows.map(v => {
          const cliente = state.clientes.find(c => c.id === v.clienteId);
          const lucro = calcLucroVenda(v);
          const isOpen = state.expandedVenda === v.id;
          return `<tr style="cursor:pointer;" data-toggle-venda="${sfHtml(v.id)}">
            <td style="width:24px;color:var(--text-tertiary);">${isOpen ? '▾' : '▸'}</td>
            <td class="mono">${sfHtml(v.numero || '—')}</td>
            <td>${fmtDate(v.data)}</td>
            <td>${sfHtml(cliente ? cliente.nome : '—')}</td>
            <td>${summarizeItens(v.itens)}</td>
            <td class="mono">${fmtBRL(v.receita)}</td>
            <td class="mono">${fmtBRL(v.custoTotal)}</td>
            <td class="mono">${fmtBRL(v.frete)}</td>
            <td class="mono" style="color:${lucro >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmtBRL(lucro)}</td>
            <td style="display:flex;gap:4px;white-space:nowrap;">
              <button class="btn-outline btn-sm" data-ship-sale="${sfHtml(v.id)}">${v.freteLogistica?.orderId ? 'Nova cotação' : 'Cotação de frete'}</button>
              <button class="btn-outline btn-sm" data-edit-venda="${sfHtml(v.id)}">Editar</button>
              <button class="btn-danger" data-del-venda="${sfHtml(v.id)}">✕</button>
            </td>
          </tr>${isOpen ? `<tr><td colspan="2"></td><td colspan="8" style="padding:0;background:transparent;">
            <div class="expand-wrap">
              <div class="expand-label">Produtos deste pedido</div>
              <div class="product-chip-grid">
                ${(v.itens || []).map(it => {
                  const p = getProduto(it.produtoId);
                  return `<div class="product-chip">
                    <div class="product-chip-top">
                      <span class="product-chip-code">${sfHtml(p ? p.nome : it.produtoId)}</span>
                      <span class="pill pill-neutral">${sfHtml(it.qtd)} un</span>
                    </div>
                    <div class="product-chip-row"><span>Unit.</span><span class="mono">${fmtBRL(it.precoVenda)}</span></div>
                    <div class="product-chip-row total"><span>Subtotal</span><span class="mono">${fmtBRL((it.precoVenda || 0) * (it.qtd || 0))}</span></div>
                  </div>`;
                }).join('')}
              </div>
              <div class="tiny" style="color:var(--text-tertiary);margin-top:10px;">Pagamento: ${v.formaPagamento === 'cartao' ? `Cartão (${v.parcelas || 1}x) — taxa: ${fmtBRL(v.taxaCartaoValor || 0)}` : 'Pix'}</div>
              ${v.freteLogistica ? `<div class="card" style="margin-top:12px;padding:12px;"><strong>Entrega · ${sfHtml(v.freteLogistica.provider || 'SuperFrete')}</strong><div class="tiny" style="margin-top:5px;">${sfHtml(v.freteLogistica.carrier || 'Transportadora')} · ${sfHtml(v.freteLogistica.service || 'Serviço')} · ${sfHtml(v.freteLogistica.status || 'Cotado')}${v.freteLogistica.deliveryTime ? ` · prazo ${sfHtml(v.freteLogistica.deliveryTime)} dias úteis` : ''}</div><div class="tiny">Frete cotado: ${v.freteLogistica.quoteAmount == null ? '—' : fmtBRL(Number(v.freteLogistica.quoteAmount))} · valor confirmado: ${v.freteLogistica.actualAmount == null ? 'aguardando etiqueta' : fmtBRL(Number(v.freteLogistica.actualAmount))}${v.freteLogistica.orderId ? ` · etiqueta ${sfHtml(v.freteLogistica.orderId)}` : ''}</div><div class="tiny">Rastreio: ${sfHtml(state.sfEtiquetas.find(item => item.superfreteOrderId === v.freteLogistica.orderId)?.trackingCode || 'ainda não disponível')}</div></div>` : '<div class="tiny" style="margin-top:10px;color:var(--text-tertiary);">Frete: ainda sem cotação/etiqueta vinculada.</div>'}
            </div>
          </td></tr>` : ''}`;
        }).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

function renderProdutos() {
  const produtos = state.produtos;
  
  return `
    <h1 class="page-title">Catálogo de Produtos</h1>
    <p class="page-sub">Gerencie todos os produtos que você vende — custos, preços e disponibilidade</p>

    <div class="toolbar">
      <div></div>
      <button class="btn-gold" id="btn-new-produto">+ Novo produto</button>
    </div>

    <div class="card" style="padding:0;overflow-x:auto;">
      ${produtos.length === 0 ? `<div class="empty">${ICONS.empty}<div>Nenhum produto cadastrado. Clique em "Novo produto" para começar.</div></div>` : `
      <table>
        <thead><tr>
          <th>Nome</th>
          <th>Código</th>
          <th>Custo (R$)</th>
          <th>Venda (R$)</th>
          <th>Margem</th>
          <th>Estoque</th>
          <th>Status</th>
          <th></th>
        </tr></thead>
        <tbody>
        ${produtos.map(p => {
          const margem = p.custo > 0 ? ((p.venda - p.custo) / p.custo * 100) : 0;
          const controlaEstoque = temControleEstoque(p.id);
          const estoqueBaixo = controlaEstoque && (parseFloat(p.estoque) || 0) <= (parseFloat(p.estoqueMinimo) || 0);
          return `<tr>
            <td><strong>${sfHtml(p.nome)}</strong>${p.descricao ? `<div class="tiny" style="color:var(--text-tertiary);">${p.descricao}</div>` : ''}</td>
            <td class="mono">${sfHtml(p.codigo || '—')}</td>
            <td class="mono">${fmtBRL(p.custo)}</td>
            <td class="mono">${fmtBRL(p.venda)}</td>
            <td><span class="pill ${margem >= 40 ? 'pill-success' : margem >= 20 ? 'pill-neutral' : 'pill-danger'}">${margem.toFixed(0)}%</span></td>
            <td>${controlaEstoque ? `<span class="pill ${estoqueBaixo ? 'pill-danger' : 'pill-neutral'}">${sfHtml(p.estoque)} un${estoqueBaixo ? ' ⚠️' : ''}</span>` : '<span class="tiny" style="color:var(--text-tertiary);">não controla</span>'}</td>
            <td>${p.ativo !== false ? '<span class="pill pill-success">Ativo</span>' : '<span class="pill pill-danger">Inativo</span>'}</td>
            <td style="display:flex;gap:4px;white-space:nowrap;">
              <button class="btn-outline btn-sm" data-edit-produto="${sfHtml(p.id)}">Editar</button>
              <button class="btn-danger" data-del-produto="${sfHtml(p.id)}">✕</button>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="note">Produtos ativos aparecem nas vendas e orçamentos. Produtos inativos ficam ocultos mas mantêm o histórico.</div>
  `;
}

      <button class="btn-danger" id="btn-reset-all">Resetar todos os dados</button>

function renderAgenda() {
  const withRetorno = state.clientes.filter(c => c.proximoRetorno && c.proximoRetorno.data);
  withRetorno.sort((a, b) => a.proximoRetorno.data.localeCompare(b.proximoRetorno.data));
  const today = todayStr();
  return `
    <h1 class="page-title">Agenda de retornos</h1>
    <p class="page-sub">Combinou de retornar com algum chaveiro? Marque no perfil dele — aqui fica tudo organizado por data.</p>

function renderConversorResultado(results) {
  const ok = results.filter(r => r.status === 'ok');
  const problemas = results.filter(r => r.status !== 'ok');
  const totalYale = ok.filter(r => r.item.linha === 'yale').reduce((s, r) => s + (r.qty || 0), 0);
  const totalTetra = ok.filter(r => r.item.linha === 'tetra').reduce((s, r) => s + (r.qty || 0), 0);

  const naoEncontrados = results.filter(r => r.status === 'nao_encontrado' || r.status === 'vazio' || r.status === 'gorja');
  naoEncontrados.forEach(r => {
    if (r.codigo) registrarCodigoNaoEncontrado(r.codigo);
  });

  return `
    <div class="section-title"><span class="key-mark"></span>Códigos identificados (${ok.length})</div>
    ${ok.length === 0 ? `<div class="note">Nenhum código reconhecido ainda.</div>` : `
    <div class="grid grid-2">
      ${ok.map(r => `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-family:'Inter',sans-serif;font-weight:700;font-size:15px;color:var(--gold);">🔑 ${sfHtml(r.item.jsa)}</span>
            ${r.qty ? `<span class="pill pill-success">${sfHtml(r.qty)} un</span>` : `<span class="pill pill-neutral">qtd. não informada</span>`}
          </div>
          <div style="font-size:12.5px;color:var(--text-secondary);line-height:1.8;">
            Fabricante: <strong style="color:var(--text);">${sfHtml(r.item.fab)}</strong> · Linha: <strong style="color:var(--text);">${r.item.linha === 'tetra' ? 'Tetra' : 'Yale'}</strong><br>
            ${[r.item.gold && r.item.gold !== 'X' ? 'Gold: ' + r.item.gold : '', r.item.jas && r.item.jas !== 'X' ? 'JAS: ' + r.item.jas : '', r.item.land && r.item.land !== 'X' ? 'Land: ' + r.item.land : '', r.item.dovale && r.item.dovale !== 'X' ? 'Dovale: ' + r.item.dovale : ''].filter(Boolean).join(' · ')}<br>
            ${[r.item.silca && r.item.silca !== 'X' ? 'Silca: ' + r.item.silca : '', r.item.rca && r.item.rca !== 'X' ? 'RCA: ' + r.item.rca : ''].filter(Boolean).join(' · ')}
          </div>
          <div class="tiny" style="color:var(--text-tertiary);margin-top:8px;border-top:1px solid var(--border);padding-top:6px;">linha digitada: "${sfHtml(r.original)}"</div>
        </div>`).join('')}
    </div>`}

    ${problemas.length ? `
    <div class="section-title"><span class="key-mark"></span>Precisa de atenção (${problemas.length})</div>
    <div class="card">
      ${problemas.map(p => {
        let msg;
        if (p.status === 'nao_encontrado') msg = 'Não encontrei esse código na tabela oficial JSA 🔑 Vou registrar como "código pendente".';
        else if (p.status === 'gorja') msg = 'No momento trabalhamos apenas com linha Yale e Tetra JSA 🔑';
        else if (p.status === 'vazio') msg = 'Linha vazia ou ilegível.';
        else if (p.status === 'ambiguo') msg = 'Código ambíguo — encontrado em mais de um modelo: ' + p.opcoes.map(o => `${sfHtml(o.jsa)} (${sfHtml(o.fab)})`).join(', ') + '. Selecione a marca de referência acima.';
        return `<div style="padding:9px 0;border-bottom:1px solid var(--border);">
          <div class="mono" style="font-size:12px;color:var(--text-tertiary);">"${sfHtml(p.original)}"</div>
          <div style="font-size:13px;color:var(--danger);margin-top:3px;">${msg}</div>
        </div>`;
      }).join('')}
    </div>` : ''}

    ${ok.length ? `
    <div class="section-title"><span class="key-mark"></span>Resumo</div>
    <div class="grid grid-3">
      <div class="card stat-card"><div class="stat-label">Total Yale</div><div class="stat-value" style="font-size:18px;">${totalYale} un</div></div>
      <div class="card stat-card"><div class="stat-label">Total Tetra</div><div class="stat-value" style="font-size:18px;">${totalTetra} un</div></div>
      <div class="card" style="display:flex;align-items:center;justify-content:center;">
        <button class="btn-gold btn-sm" id="btn-conversor-orcamento">Criar orçamento</button>
      </div>
    </div>` : ''}
  `;
}

function renderCatalogo() {
  const q = state.catalogSearch || '';
  const filtrados = ALL_DB.filter(e => {
    if (!q) return true;
    const ql = q.toLowerCase().trim();
    const campos = [e.jsa, e.fab, e.gold, e.jas, e.land, e.dovale, e.silca, e.rca];
    return campos.some(v => v && v !== 'X' && v.toString().toLowerCase().includes(ql));
  });
  const grupos = {};
  filtrados.forEach(e => { grupos[e.fab] = grupos[e.fab] || []; grupos[e.fab].push(e); });
  const fabricantes = Object.keys(grupos).sort();
  const buscando = q.trim().length > 0;
  return `
    <h1 class="page-title">Catálogo de modelos</h1>
    <p class="page-sub">Referência rápida de todos os modelos Yale e Tetra cadastrados no conversor de códigos.</p>
    <div class="field" style="max-width:340px;margin-bottom:16px;">
      <input id="catalogo-search" placeholder="Buscar por código (JSA, Gold, JAS, Land, Dovale, Silca, RCA)..." value="${sfHtml(q)}">
    </div>
    ${renderCatalogQuoteDraft()}
    ${fabricantes.length === 0 ? `<div class="empty">${ICONS.empty}<div>Nenhum modelo encontrado para "${q}".</div></div>` : fabricantes.map(fab => {
      const aberto = buscando || !!state.catalogOpenFab[fab];
      return `
      <div class="catalog-group-header" data-toggle-fab="${fab}" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin:20px 0 10px 0;padding:10px 14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;">
        <div class="section-title" style="margin:0;"><span class="key-mark"></span>${fab} <span class="tiny" style="color:var(--text-tertiary);font-weight:400;">(${grupos[fab].length} modelo${grupos[fab].length > 1 ? 's' : ''})</span></div>
        <span class="tiny" style="color:var(--text-tertiary);">${aberto ? '▲ ocultar' : '▼ ver modelos'}</span>
      </div>
      ${aberto ? `<div class="grid grid-3" style="margin-bottom:6px;">
        ${grupos[fab].map(e => `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <button type="button" data-catalog-add="${sfHtml(e.jsa)}" data-catalog-line="${sfHtml(e.linha)}" title="Clique para informar a quantidade e incluir no orçamento" style="border:0;background:transparent;padding:0;color:var(--gold);font:700 15px Inter,sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px;">🔑 ${sfHtml(e.jsa)}</button>
              <span class="pill ${e.linha === 'yale' ? 'pill-neutral' : 'pill-success'}">${e.linha === 'yale' ? 'Yale' : 'Tetra'}</span>
            </div>
            <div class="tiny" style="color:var(--text-secondary);line-height:1.8;">
              ${e.gold && e.gold !== 'X' ? `Gold: ${e.gold} · ` : ''}${e.jas && e.jas !== 'X' ? `JAS: ${e.jas} · ` : ''}${e.land && e.land !== 'X' ? `Land: ${e.land}` : ''}<br>
              ${e.dovale && e.dovale !== 'X' ? `Dovale: ${e.dovale} · ` : ''}${e.silca && e.silca !== 'X' ? `Silca: ${e.silca} · ` : ''}${e.rca && e.rca !== 'X' ? `RCA: ${e.rca}` : ''}
            </div>
          </div>`).join('')}
      </div>` : ''}
    `;}).join('')}

function renderCatalogQuoteDraft() {
  if (!state.catalogQuoteItems.length) return '';
  const client = state.clientes.find(c => c.id === state.catalogQuoteClientId);
  const options = `<option value="">— cliente não cadastrado —</option>` + state.clientes.map(c => `<option value="${sfHtml(c.id)}" ${c.id === state.catalogQuoteClientId ? 'selected' : ''}>${sfHtml(c.nome)}</option>`).join('');
  const totals = calcItensTotals(state.catalogQuoteItems);
  const recipient = state.catalogQuoteRecipient && Object.keys(state.catalogQuoteRecipient).length ? state.catalogQuoteRecipient : recipientFromClient(client);
  return `<div class="card" id="catalog-quote-builder" style="margin-bottom:20px;border:2px solid var(--gold);">
    <h2 style="margin-top:0;">Orçamento rápido · ${state.catalogQuoteItems.length} modelo(s)</h2>
    <p class="tiny">Clique em qualquer código do catálogo para adicionar ou atualizar a quantidade. Você pode concluir aqui sem sair desta página.</p>

      ${state.catalogQuoteItems.map((item,index) => `<tr><td class="mono">${sfHtml(item.modelo)}</td><td>${item.produtoId === 'tetra' ? 'Tetra' : 'Yale'}</td><td><input type="number" min="1" step="1" value="${sfHtml(item.qtd)}" data-catalog-quote-qty="${index}" style="max-width:100px;"></td><td><button type="button" class="btn-danger" data-catalog-remove-item="${index}">Remover</button></td></tr>`).join('')}
    </tbody></table></div>

    <form id="catalog-quote-recipient">${renderRecipientFields(recipient)}</form>
    <div class="modal-actions"><button type="button" class="btn-outline" id="btn-clear-catalog-quote">Limpar rascunho</button><button type="button" class="btn-primary" id="btn-save-catalog-quote">Salvar orçamento</button></div>
  </div>`;
}

function renderContasPagar() {
  let rows = [...state.contasPagar];
  const today = todayStr();
  rows.forEach(c => { c._vencida = c.status === 'pendente' && c.vencimento < today; });
  if (state.contasPagarFilter === 'pendente') rows = rows.filter(c => c.status === 'pendente' && !c._vencida);
  if (state.contasPagarFilter === 'vencido') rows = rows.filter(c => c._vencida);
  if (state.contasPagarFilter === 'pago') rows = rows.filter(c => c.status === 'pago');
  rows.sort((a, b) => a.vencimento.localeCompare(b.vencimento));

  const pendentesTotal = state.contasPagar.filter(c => c.status === 'pendente').reduce((s, c) => s + c.valor, 0);
  const vencidasTotal = state.contasPagar.filter(c => c.status === 'pendente' && c.vencimento < today).reduce((s, c) => s + c.valor, 0);

  return `
    <h1 class="page-title">Contas a pagar</h1>
    <p class="page-sub">Controle de despesas — fornecedor, frete, taxas e outros custos da operação.</p>

    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="card stat-card"><div class="stat-label">Total pendente</div><div class="stat-value" style="font-size:18px;">${fmtBRL(pendentesTotal)}</div></div>
      <div class="card stat-card"><div class="stat-label">Vencido</div><div class="stat-value danger" style="font-size:18px;">${fmtBRL(vencidasTotal)}</div></div>
      <div class="card stat-card"><div class="stat-label">Total de contas</div><div class="stat-value" style="font-size:18px;">${state.contasPagar.length}</div></div>
    </div>

    ${(() => {
      const d30 = new Date(); d30.setDate(d30.getDate() - 29);
      const receita30 = totalsRange(d30.toISOString().slice(0, 10), today).receita;
      const dataLimite = new Date(); dataLimite.setDate(dataLimite.getDate() + 30);
      const dataLimiteStr = dataLimite.toISOString().slice(0, 10);
      const despesasProx30 = state.contasPagar.filter(c => c.status === 'pendente' && c.vencimento <= dataLimiteStr).reduce((s, c) => s + c.valor, 0);
      const saldoProjetado = receita30 - despesasProx30;
      return `
      <div class="section-title"><span class="key-mark"></span>Fluxo de caixa projetado (próximos 30 dias)</div>
      <div class="grid grid-3" style="margin-bottom:20px;">
        <div class="card stat-card"><div class="stat-label">Receita (últimos 30 dias)</div><div class="stat-value success" style="font-size:18px;">${fmtBRL(receita30)}</div></div>
        <div class="card stat-card"><div class="stat-label">Contas a vencer (30 dias)</div><div class="stat-value danger" style="font-size:18px;">${fmtBRL(despesasProx30)}</div></div>
        <div class="card stat-card"><div class="stat-label">Saldo projetado</div><div class="stat-value ${saldoProjetado >= 0 ? 'success' : 'danger'}" style="font-size:18px;">${fmtBRL(saldoProjetado)}</div></div>
      </div>
      <div class="note">Estimativa com base no faturamento dos últimos 30 dias comparado às contas já cadastradas com vencimento nos próximos 30 dias.</div>
      `;
    })()}

    <div class="toolbar">
      <div class="filters">
        <div class="chip ${state.contasPagarFilter === 'todos' ? 'active' : ''}" data-cp-filter="todos">Todas</div>
        <div class="chip ${state.contasPagarFilter === 'pendente' ? 'active' : ''}" data-cp-filter="pendente">Pendentes</div>
        <div class="chip ${state.contasPagarFilter === 'vencido' ? 'active' : ''}" data-cp-filter="vencido">Vencidas</div>
        <div class="chip ${state.contasPagarFilter === 'pago' ? 'active' : ''}" data-cp-filter="pago">Pagas</div>
      </div>
      <button class="btn-gold" id="btn-new-conta-pagar">+ Nova conta</button>
    </div>

    <div class="card" style="padding:0;overflow-x:auto;">
      ${rows.length === 0 ? `<div class="empty">${ICONS.empty}<div>Nenhuma conta nessa condição.</div></div>` : `
      <table>
        <thead><tr><th>Vencimento</th><th>Fornecedor</th><th>Categoria</th><th>Valor</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${rows.map(c => `
          <tr>
            <td>${fmtDate(c.vencimento)}</td>
            <td>${sfHtml(c.fornecedor)}</td>
            <td>${sfHtml(c.categoria)}</td>
            <td class="mono">${fmtBRL(c.valor)}</td>
            <td>${c.status === 'pago' ? '<span class="pill pill-success">Pago</span>' : c._vencida ? '<span class="pill pill-danger">Vencida</span>' : '<span class="pill pill-neutral">Pendente</span>'}</td>
            <td style="display:flex;gap:4px;white-space:nowrap;">
              ${c.status === 'pendente' ? `<button class="btn-outline btn-sm" data-pay-conta="${sfHtml(c.id)}">Marcar pago</button>` : ''}
              <button class="btn-outline btn-sm" data-edit-conta="${sfHtml(c.id)}">Editar</button>
              <button class="btn-danger" data-del-conta="${sfHtml(c.id)}">✕</button>
            </td>
          </tr>
        `).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

function renderPagamentos() {
  const configured = !!state.infinitePayConfig.configured;
  const paymentCheckConfigured = !!state.infinitePayConfig.paymentCheckConfigured;
  const activeStatuses = new Set(['creating', 'uncertain', 'pending', 'paid', 'review']);
  const paymentForSale = saleId => state.pagamentos.find(payment => payment.sale_id === saleId && activeStatuses.has(payment.status));
  const sales = [...state.vendas].sort((a, b) => String(b.data || '').localeCompare(String(a.data || ''))).slice(0, 30);
  const payments = [...state.pagamentos].sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
  const methodName = method => method === 'credit_card' ? 'Cartão de crédito' : 'Pix habilitado · cartão também disponível';
  const statusName = status => ({ creating: 'Criando', uncertain: 'Resultado incerto', pending: 'Aguardando pagamento', paid: 'Pago', review: 'Revisar valor', failed: 'Falhou' }[status] || '—');
  const statusClass = status => status === 'paid' ? 'pill-success' : status === 'failed' ? 'pill-danger' : status === 'review' || status === 'uncertain' ? 'pill-danger' : 'pill-neutral';
  return `
    <h1 class="page-title">Pagamentos InfinitePay</h1>
    <p class="page-sub">Gere links hospedados pela InfinitePay para vendas do CRM ou cobranças avulsas. Os dados do cartão nunca passam pelo JSA CRM.</p>

    <div class="card" style="margin-bottom:20px;">
      <h2 style="margin-top:0;">Cobrança avulsa</h2>
      <p class="tiny">Gera um link sem criar venda, orçamento nem baixar estoque.</p>
      <form id="form-infinitepay-manual">
        <div class="grid grid-2">
          <div class="field"><label>Descrição *</label><input name="description" required maxlength="120" placeholder="Ex.: Serviço de chaveiro"></div>
          <div class="field"><label>Valor (R$) *</label><input name="amount" type="number" min="0.01" max="1000000" step="0.01" required placeholder="0,00"></div>
          <div class="field"><label>Meio a habilitar no checkout</label><select name="payment_method"><option value="pix">Pix (cartão também fica disponível)</option><option value="credit_card">Cartão de crédito</option></select></div>
          <div class="field"><label>Cliente (opcional)</label><select name="client_id"><option value="">Sem cliente vinculado</option>${state.clientes.map(client => `<option value="${sfHtml(client.id)}">${sfHtml(client.nome || 'Cliente')}</option>`).join('')}</select></div>
        </div>
        <button type="submit" class="btn-primary" ${configured ? '' : 'disabled'}>Gerar link de pagamento</button>
      </form>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h2 style="margin-top:0;">Gerar link para uma venda</h2>
      <p class="tiny">Ao converter um orçamento, o JSA CRM tenta gerar automaticamente o link usando a forma de pagamento escolhida no orçamento. Também é possível gerar um link abaixo para uma venda já registrada.</p>
      ${sales.length ? `<div style="overflow-x:auto;"><table><thead><tr><th>Venda</th><th>Cliente</th><th>Total a cobrar</th><th>Método</th><th></th></tr></thead><tbody>${sales.map(sale => {
        const client = state.clientes.find(item => item.id === sale.clienteId);
        const activePayment = paymentForSale(sale.id);
        const total = (sale.itens || []).reduce((sum, item) => sum + (Math.round((parseFloat(item.precoVenda) || 0) * 100) * (parseInt(item.qtd) || 0)) / 100, 0) + (sale.freteAssumido === 'cliente' ? (parseFloat(sale.frete) || 0) : 0);
        return `<tr><td class="mono">${sfHtml(sale.numero || '—')}</td><td>${sfHtml(client?.nome || sale.clienteNome || '—')}</td><td class="mono">${fmtBRL(total)}</td><td><select data-sale-payment-method="${sfHtml(sale.id)}"><option value="pix" ${(sale.formaPagamento || 'pix') === 'pix' ? 'selected' : ''}>Pix + cartão</option><option value="credit_card" ${sale.formaPagamento === 'cartao' ? 'selected' : ''}>Cartão</option></select></td><td>${activePayment ? `<span class="pill ${statusClass(activePayment.status)}">${statusName(activePayment.status)}</span>` : `<button type="button" class="btn-outline btn-sm" data-gen-sale-payment="${sfHtml(sale.id)}" ${configured ? '' : 'disabled'}>Gerar link</button>`}</td></tr>`;
      }).join('')}</tbody></table></div>` : `<div class="empty">Nenhuma venda disponível para cobrança.</div>`}
    </div>

    <div class="card" style="padding:0;overflow-x:auto;">
      <div style="padding:18px 18px 0;"><h2 style="margin:0;">Links e pagamentos</h2></div>
      ${payments.length ? `<table><thead><tr><th>Pedido/descrição</th><th>Forma</th><th>Valor</th><th>Status</th><th>Criado</th><th>Checkout / conciliação</th></tr></thead><tbody>${payments.map(payment => `<tr>
        <td>${sfHtml(payment.sale_number || payment.description || payment.order_nsu || 'Cobrança')}<div class="tiny mono">${sfHtml(payment.order_nsu || '')}</div></td>
        <td>${sfHtml(methodName(payment.payment_method))}</td>
        <td class="mono">${fmtBRL((Number(payment.amount_cents) || 0) / 100)}</td>
        <td><span class="pill ${statusClass(payment.status)}">${sfHtml(statusName(payment.status))}</span></td>
        <td>${payment.created_at ? fmtDate(String(payment.created_at).slice(0,10)) : '—'}</td>
        <td>${payment.checkout_url ? `<a class="btn-outline btn-sm" href="${sfHtml(payment.checkout_url)}" target="_blank" rel="noopener noreferrer">Abrir checkout</a>` : 'Sem URL'}
          ${['pending','review','paid'].includes(payment.status) ? `<details style="margin-top:7px;"><summary class="tiny">Consultar após o pagamento</summary><form data-payment-check="${sfHtml(payment.id)}" style="min-width:220px;margin-top:8px;"><input name="transaction_nsu" required maxlength="200" placeholder="transaction_nsu do retorno"><input name="slug" required maxlength="200" placeholder="slug da fatura"><button type="submit" class="btn-outline btn-sm" ${paymentCheckConfigured ? '' : 'disabled'}>Consultar status</button>${paymentCheckConfigured ? '' : '<span class="tiny">Configure INFINITEPAY_HANDLE no servidor para habilitar a consulta.</span>'}</form></details>` : ''}
          ${['uncertain','creating'].includes(payment.status) ? `<details style="margin-top:7px;"><summary class="tiny">Recuperar tentativa incerta</summary><p class="tiny">Confira primeiro no painel InfinitePay se o pedido <span class="mono">${sfHtml(payment.order_nsu)}</span> não foi criado. Só então libere uma nova tentativa.</p><button type="button" class="btn-danger" data-resolve-payment="${sfHtml(payment.id)}" data-order-nsu="${sfHtml(payment.order_nsu)}">Confirmar que não foi criado</button></details>` : ''}
        </td></tr>`).join('')}</tbody></table>` : `<div class="empty">Nenhum link de pagamento criado.</div>`}
    </div>
    <p class="tiny" style="margin-top:12px;">Um link pendente não significa que a venda foi paga. A InfinitePay mantém cartão de crédito disponível; ao selecionar Pix, o link habilita Pix também, mas não garante um checkout exclusivo de Pix. O status só muda para Pago após consulta autenticada confirmar o valor em centavos.</p>
  `;
}

function renderLogistica() {
  const sub = state.logisticaTab || 'config';
  const subTabs = [
    { id: 'cotacao', label: 'Cotação e envio' },
    { id: 'config', label: 'Configurações SuperFrete' },
    { id: 'embalagens', label: 'Embalagens' },
    { id: 'pesos', label: 'Peso dos produtos' },
    { id: 'etiquetas', label: 'Etiquetas & Rastreamento' }
  ];
  return `
    <h1 class="page-title">Logística</h1>
    <p class="page-sub">Integração com a SuperFrete — cotação automática, embalagens, peso por modelo e emissão de etiquetas.</p>

    <div class="filters" style="margin-bottom:18px;">
      ${subTabs.map(t => `<div class="chip ${sub === t.id ? 'active' : ''}" data-logistica-tab="${t.id}">${t.label}</div>`).join('')}
    </div>

    ${sub === 'cotacao' ? renderLogisticaQuote() : ''}
    ${sub === 'config' ? renderLogisticaConfig() : ''}
    ${sub === 'embalagens' ? renderLogisticaEmbalagens() : ''}
    ${sub === 'pesos' ? renderLogisticaPesos() : ''}
    ${sub === 'etiquetas' ? renderLogisticaEtiquetas() : ''}
  `;
}

function sfHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function sfCarrierDisplay(item) {
  const raw = item?.company?.name || item?.company || item?.carrier?.name || item?.carrier || item?.company_name || item?.transportadora || item?.name || '';
  const normalized = String(raw).trim().toLowerCase();
  if (normalized.includes('jadlog')) return 'Jadlog';
  if (normalized.includes('loggi')) return 'Loggi';
  if (normalized.includes('correios') || normalized === 'correio') return 'Correios';
  if (normalized.includes('j&t')) return 'J&T';
  return raw || 'Transportadora';
}
